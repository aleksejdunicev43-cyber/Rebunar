<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 116" role="img" aria-labelledby="title">
  <title id="title">REBUNAR</title>
  <defs>
    <linearGradient id="metal" x1="0" y1="0" x2="0.15" y2="1">
      <stop offset="0" stop-color="#f4d9ff"/>
      <stop offset=".18" stop-color="#c58aff"/>
      <stop offset=".42" stop-color="#7925e8"/>
      <stop offset=".62" stop-color="#3c087e"/>
      <stop offset=".82" stop-color="#a94dff"/>
      <stop offset="1" stop-color="#f0caff"/>
    </linearGradient>
    <linearGradient id="edge" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f4baff"/>
      <stop offset=".5" stop-color="#8b27ff"/>
      <stop offset="1" stop-color="#4c0c9c"/>
    </linearGradient>
    <filter id="glow" x="-30%" y="-50%" width="160%" height="200%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feColorMatrix in="blur" type="matrix" values="0.65 0 0 0 0.25  0 0.1 0 0 0  0 0 1 0 0.9  0 0 0 1 0" result="purpleGlow"/>
      <feMerge><feMergeNode in="purpleGlow"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="softGlow" x="-30%" y="-100%" width="160%" height="300%">
      <feGaussianBlur stdDeviation="2.2"/>
    </filter>
  </defs>
  <g filter="url(#glow)">
    <text x="260" y="76" text-anchor="middle"
      font-family="Georgia, 'Times New Roman', serif" font-size="66"
      font-weight="900" letter-spacing="2.2" font-style="italic"
      fill="url(#metal)" stroke="url(#edge)" stroke-width="1.8"
      paint-order="stroke fill">REBUNAR</text>
    <path d="M58 94 H214 M306 94 H462" stroke="#a94dff" stroke-width="2.2" opacity=".95"/>
    <path d="M58 94 H214 M306 94 H462" stroke="#d7a1ff" stroke-width="5" opacity=".55" filter="url(#softGlow)"/>
    <path d="M260 82 L272 94 L260 108 L248 94 Z" fill="url(#metal)" stroke="#dcb2ff" stroke-width="1.4"/>
    <path d="M260 87 L266 94 L260 101 L254 94 Z" fill="#7d28e8"/>

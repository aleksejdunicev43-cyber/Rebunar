<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#08090a">
  <title>Rebunar</title>
  <link rel="icon" type="image/png" href="/new/build/rebunar_avatar.png">

  <!-- Critical startup paint: prevent the browser's default white flash before CSS loads. -->
  <style>
    :root { color-scheme: dark; background: #101216; }
    html, body { min-width: 320px; min-height: 100%; margin: 0; background: #101216; }
    body { min-height: 100vh; min-height: 100dvh; color: #f0f2f4; font-family: Inter, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
    #app { min-height: 100vh; min-height: 100dvh; }
    .rebunar-boot { position: fixed; inset: 0; z-index: 9999; display: grid; min-height: 100vh; min-height: 100dvh; place-items: center; padding: 24px; box-sizing: border-box; background: radial-gradient(ellipse at 50% 42%, rgba(227,59,80,.14), transparent 48%), #101216; text-align: center; opacity: 1; visibility: visible; pointer-events: auto; transition: opacity 260ms ease, visibility 260ms ease; }
    .rebunar-boot.is-leaving { opacity: 0; visibility: hidden; pointer-events: none; }
    .rebunar-boot-content { display: flex; flex-direction: column; align-items: center; gap: 14px; }
    .rebunar-boot-mark { color: #f0f2f4; font-size: clamp(30px, 9vw, 44px); font-weight: 950; letter-spacing: .2em; text-indent: .2em; text-shadow: 0 0 24px rgba(227,59,80,.35); }
    .rebunar-boot-line { width: 112px; height: 3px; overflow: hidden; border-radius: 99px; background: #242a30; }
    .rebunar-boot-line::after { display: block; width: 42%; height: 100%; border-radius: inherit; background: #e33b50; box-shadow: 0 0 12px #e33b50; content: ""; animation: rebunar-boot-progress 1.15s ease-in-out infinite; }
    .rebunar-boot-caption { color: #9da6af; font-size: 11px; letter-spacing: .16em; }
    @keyframes rebunar-boot-progress { from { transform: translateX(-110%); } to { transform: translateX(260%); } }
    @media (prefers-reduced-motion: reduce) { .rebunar-boot-line::after { animation-duration: 2.5s; } }
  </style>

  <link rel="stylesheet" href="./styles/base.css">
  <link rel="stylesheet" href="./styles/layout.css?v=avatar-square-20261106-1">
  <link rel="stylesheet" href="./features/auth/auth.css">
  <link rel="stylesheet" href="./features/profile/profile.css?v=avatar-square-20261106-1">
  <link rel="stylesheet" href="./features/users/users.css?v=avatar-system-20261104-7">
  <link rel="stylesheet" href="./features/statistics/statistics.css">
  <link rel="stylesheet" href="./features/settings/settings.css">
  <link rel="stylesheet" href="./features/home/home.css">
</head>

<body>
  <div id="app">
    <section class="rebunar-boot" role="status" aria-live="polite">
      <div class="rebunar-boot-content">
        <div class="rebunar-boot-mark">REBUNAR</div>
        <div class="rebunar-boot-line" aria-hidden="true"></div>
        <div class="rebunar-boot-caption">ЗАГРУЗКА ПРИЛОЖЕНИЯ</div>
      </div>
    </section>
  </div>

  <script type="module" src="./app/app.js?v=boot-preload-20261106-1"></script>
</body>
</html>

<script>
/* REBUNAR_SEARCH_DELEGATED */
function applyRebunarSearch() {
  const input = document.getElementById('webSearch');
  if (!input) return;

  const query = input.value.trim().toLocaleLowerCase('ru');
  const cards = document.querySelectorAll('main .feed-item');
  let visible = 0;

  cards.forEach(function(card) {
    const matches = card.textContent.toLocaleLowerCase('ru').includes(query);
    card.style.display = matches ? '' : 'none';
    if (matches) visible++;
  });

  const status = document.getElementById('searchStatus');
  if (status) {
    status.textContent = query
      ? (visible ? 'Найдено карточек: ' + visible : 'Ничего не найдено')
      : 'Поиск по материалам Rebunar';
  }
}

function runRebunarSearch(event) {
  if (event.target && event.target.id === 'webSearch') {
    applyRebunarSearch();
  }
}
document.addEventListener('input', runRebunarSearch);
document.addEventListener('search', runRebunarSearch);
document.addEventListener('change', runRebunarSearch);
</script>

<script>

const showBeforeProfile = showScreen;

showScreen = function(name) {
  if (name.includes('Профиль')) {
    renderProfile();
  } else {
    showBeforeProfile(name);
  }
};

async function renderProfile() {
  const main = document.querySelector('main');

  try {
    const response = await fetch('/api/me');
    const user = await response.json();

    if (user.logged_in) {
      main.innerHTML = `
        <h1>◉ Мой профиль</h1>
        <div class="game-card">
          <div id="profileAvatar" onclick="openAvatarPicker()" style="width:110px;height:110px;border-radius:50%;margin:0 auto 12px;overflow:hidden;background:#24134a;display:flex;align-items:center;justify-content:center;font-size:54px;cursor:pointer;border:2px solid #8b3dff">👤</div>
          <h2></h2>
          <p>Участник Rebunar</p>
          <button onclick="editProfile()">Изменить профиль</button>
          <button onclick="logoutRebunar()">Выйти</button>
          <div id="profileEdit"></div>
        </div>`;
      main.querySelector('.game-card h2').textContent = user.username;
    } else {
      main.innerHTML = `
        <h1>◉ Мой профиль</h1>
        <div class="game-card">
          <h2>Вход в Rebunar</h2>
          <input id="authUsername" placeholder="Логин"
            style="width:100%;padding:12px;margin-top:12px">
          <input id="authPassword" type="password" placeholder="Пароль"
            style="width:100%;padding:12px;margin-top:12px">
          <button onclick="loginRebunar()">Войти</button>
          <button onclick="registerRebunar()">Зарегистрироваться</button>
          <p id="authStatus"></p>
        </div>`;
    }
  } catch (error) {
    main.innerHTML = '<h1>◉ Мой профиль</h1><div class="game-card"><p>Не удалось подключиться к серверу Rebunar.</p></div>';
  }
}

async function registerRebunar() {
  const username = document.getElementById('authUsername').value.trim();
  const password = document.getElementById('authPassword').value;
  const status = document.getElementById('authStatus');

  try {
    const response = await fetch('/api/register', {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({username, password})
    });
    const data = await response.json();

    if (!response.ok) {
      status.textContent = data.error || 'Ошибка регистрации';
      return;
    }
    status.textContent = 'Аккаунт создан! Теперь войди.';
  } catch (error) {
    status.textContent = 'Ошибка подключения к серверу';
  }
}

async function loginRebunar() {
  const username = document.getElementById('authUsername').value.trim();
  const password = document.getElementById('authPassword').value;
  const status = document.getElementById('authStatus');

  try {
    const response = await fetch('/api/login', {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({username, password})
    });
    const data = await response.json();

    if (!response.ok) {
      status.textContent = data.error || 'Ошибка входа';
      return;
    }
    await renderProfile();
  } catch (error) {
    status.textContent = 'Ошибка подключения к серверу';
  }
}

async function logoutRebunar() {
  await fetch('/api/logout', {method: 'POST'});
  await renderProfile();
}

function editProfile() {
  document.getElementById('profileEdit').innerHTML = `
    <input id="profileName" placeholder="Твоё имя"
      style="width:100%;padding:12px;margin-top:12px">
    <textarea id="profileBio" placeholder="Расскажи о себе"
      style="width:100%;padding:12px;margin-top:12px"></textarea>
    <button onclick="saveProfile()">Сохранить</button>`;
}

async function saveProfile() {
  const name = document.getElementById('profileName').value.trim();
  const bio = document.getElementById('profileBio').value.trim();
  const edit = document.getElementById('profileEdit');

  try {
    const response = await fetch('/api/profile', {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({display_name: name, bio: bio})
    });

    const data = await response.json();

    if (!response.ok) {
      edit.textContent = data.error || 'Не удалось сохранить профиль';
      return;
    }

    await renderProfile();
  } catch (error) {
    edit.textContent = 'Ошибка подключения к серверу';
  }
}

</script>
<script>
const oldRebunarScreen = showScreen;

        <p class="rb-subtitle">Твой мир в интернете</p>

            style="width:100%;padding:14px;border-radius:12px">
        </form>
        <p>Поиск по всему интернету</p>
      </section>

      <h2>Сообщества</h2>
      <div id="communityList"><p>Загружаю сообщества...</p></div>
      <h2>Лента</h2>
      <div id="feedPosts"><p>Загружаю публикации...</p></div>
      `;

    loadHomeCommunities();
    renderRebunarPosts();

  } else {
    oldRebunarScreen(name);
  }

async function loadHomeCommunities() {
  const box = document.getElementById('communityList');
  if (!box) return;

  try {
    const response = await fetch('/api/communities');
    if (!response.ok) throw new Error('HTTP ' + response.status);
    const communities = await response.json();
    box.replaceChildren();

    if (!communities.length) {
      box.textContent = 'Сообщества пока не созданы.';
      return;
    }

    communities.forEach(c => {
      const card = document.createElement('div');
      card.className = 'game-card feed-item';
      const title = document.createElement('h3');
      title.textContent = c.name;
      const description = document.createElement('p');
      description.textContent = c.description || '';
      const open = document.createElement('button');
      open.textContent = 'Открыть';
      open.onclick = () => showScreen('Сообщества');
      card.append(title, description, open);
      box.appendChild(card);
    });
  } catch (error) {
    box.textContent = 'Не удалось загрузить сообщества. API ещё не подключён.';
  }
}
</script>




<script>
/* REBUNAR_SQLITE_API_V1 */
async function renderRebunarPosts() {
  const main = document.querySelector('main');
  if (!main) return;

  let posts;
  try {
    const response = await fetch('/api/posts');
    if (!response.ok) throw new Error('HTTP ' + response.status);
    posts = await response.json();
  } catch (error) {
    console.error('Ошибка загрузки публикаций:', error);
    let status = document.getElementById('apiLoadStatus');
    if (!status) {
      status = document.createElement('p');
      status.id = 'apiLoadStatus';
      main.appendChild(status);
    }
    status.textContent =
      'Не удалось загрузить публикации. Проверь, запущен ли сервер.';
    return;
  }

  const old = document.getElementById('savedPosts');
  if (old) old.remove();

  const status = document.getElementById('apiLoadStatus');
  if (status) status.remove();

  const section = document.createElement('section');
  section.id = 'savedPosts';

  const heading = document.createElement('h2');
  heading.textContent = 'Публикации';
  section.appendChild(heading);

  if (posts.length === 0) {
    const empty = document.createElement('p');
    empty.textContent = 'Пока публикаций нет. Создай первую!';
    section.appendChild(empty);
  }

  posts.forEach(post => {
    const card = document.createElement('div');
    card.className = 'game-card feed-item';

    const author = document.createElement('small');
    author.textContent = 'Автор: ' + (post.author || 'Автор неизвестен');

    const title = document.createElement('h2');
    title.textContent = post.title || 'Публикация';

    const body = document.createElement('p');
    body.textContent = post.body || '';

    const date = document.createElement('small');
    date.textContent = post.created_at || '';

    card.append(author, title, body, date);
    section.appendChild(card);
  });

  const feed = document.getElementById('feedPosts');
  if (feed) {
    feed.replaceChildren(section);
  } else {
    main.appendChild(section);
  }
}

publishPost = async function() {
  const titleInput = document.getElementById('postTitle');
  const textInput = document.getElementById('postText');
  const status = document.getElementById('postStatus');

  if (!titleInput || !textInput || !status) return;

  const title = titleInput.value.trim();
  const text = textInput.value.trim();

  if (!title && !text) {
    status.textContent = 'Сначала напиши что-нибудь.';
    return;
  }

  status.textContent = 'Сохраняю публикацию...';

  try {
    const response = await fetch('/api/posts', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ title, text })
    });

    const result = await response.json();

    if (!response.ok) {
      throw new Error(result.error || 'Ошибка сохранения');
    }

    titleInput.value = '';
    textInput.value = '';
    status.textContent = 'Публикация сохранена в базе данных!';
    await renderRebunarPosts();
  } catch (error) {
    console.error('Ошибка публикации:', error);
    status.textContent =
      'Не удалось сохранить. Проверь, что сервер Rebunar работает.';
  }
};

function openAvatarPicker() {
  let input = document.getElementById('avatarFileHidden');

  if (!input) {
    input = document.createElement('input');
    input.id = 'avatarFileHidden';
    input.type = 'file';
    input.accept = 'image/*';
    input.style.display = 'none';
    document.body.appendChild(input);

    input.addEventListener('change', function() {
      const file = this.files && this.files[0];
      if (!file) return;

      const reader = new FileReader();

      reader.onload = function(e) {
        avatarImage = new Image();

        avatarImage.onload = function() {
          avatarScale = 1;
          avatarOffsetX = 0;
          avatarOffsetY = 0;
          showAvatarEditor();
        };

        avatarImage.src = e.target.result;
      };

      reader.readAsDataURL(file);
    });
  }

  input.value = '';
  input.click();
}

canvas.addEventListener('touchcancel', endAvatarDrag, {passive:false});

  canvas.addEventListener('pointerdown', startAvatarDrag);
  canvas.addEventListener('pointermove', moveAvatarDrag);
  canvas.addEventListener('pointerup', endAvatarDrag);
  canvas.addEventListener('pointercancel', endAvatarDrag);
  canvas.addEventListener('pointerleave', endAvatarDrag);

  drawAvatarEditor();
}

function startAvatarDrag(event) {
  if (!avatarImage) return;

  avatarDragging = true;

  const point = event.touches[0];

  avatarStartX = point.clientX;
  avatarStartY = point.clientY;

  avatarStartOffsetX = avatarOffsetX;
  avatarStartOffsetY = avatarOffsetY;

  event.preventDefault();
}

function moveAvatarDrag(event) {
  if (!avatarDragging || !avatarImage) return;

  event.preventDefault();

  const point = event.touches[0];

  avatarOffsetX =
    avatarStartOffsetX + (point.clientX - avatarStartX);

  avatarOffsetY =
    avatarStartOffsetY + (point.clientY - avatarStartY);

  drawAvatarEditor();
}

function endAvatarDrag(event) {
  avatarDragging = false;

  if (event) {
    event.preventDefault();
  }
}

function drawAvatarEditor() {
  const canvas = document.getElementById('avatarCanvas');
  if (!canvas || !avatarImage) return;

  const ctx = canvas.getContext('2d');

  ctx.clearRect(0, 0, canvas.width, canvas.height);

  const scale = avatarScale;

  const imageRatio = avatarImage.width / avatarImage.height;
  let width;
  let height;

  if (imageRatio > 1) {
    height = canvas.height * scale;
    width = height * imageRatio;
  } else {
    width = canvas.width * scale;
    height = width / imageRatio;
  }

  const x = (canvas.width - width) / 2 + avatarOffsetX;
  const y = (canvas.height - height) / 2 + avatarOffsetY;

  ctx.drawImage(avatarImage, x, y, width, height);
}

function closeAvatarEditor() {
  const modal = document.getElementById('avatarEditorModal');
  if (modal) modal.remove();
}

async function applyAvatarEditor() {
  const canvas = document.getElementById('avatarCanvas');
  if (!canvas) return;

  const avatarData = canvas.toDataURL('image/jpeg', 0.9);

  const avatar = document.getElementById('profileAvatar');

  if (avatar) {
    avatar.innerHTML = '';

    const image = document.createElement('img');
    image.src = avatarData;
    image.style.cssText =
      'width:100%;height:100%;object-fit:cover;display:block';

    avatar.appendChild(image);
  }

  try {
    const response = await fetch('/api/profile/avatar', {
      method: 'POST',
      headers: {
        'Content-Type': 'application/json'
      },
      body: JSON.stringify({
        avatar: avatarData
      })
    });

    const data = await response.json();

    if (!response.ok) {
      alert(data.error || 'Не удалось сохранить аватар');
      return;
    }

    closeAvatarEditor();
  } catch (error) {
    alert('Ошибка подключения к серверу');
  }
}

</script>

          <button class="sb-community-switch-btn" onclick="window.renderMessagesScreen()">💬 Сообщения</button>
        </div>

          <div class="sb-communities-kicker">REBUNAR NETWORK</div>

            <h2>Загрузка...</h2>
            <p>Получаем список сообществ.</p>
          </div>
        </div>
      </section>
    `;

    try{
      const r = await fetch('/api/communities');
      if(!r.ok) throw new Error('HTTP '+r.status);
      const list = await r.json();
      const grid = document.getElementById('sbCommunityGrid');

      if(!list.length){
        grid.innerHTML = `
          <div class="sb-community-card">
            <h2>Пока пусто</h2>
            <p>Сообщества ещё не созданы.</p>
          </div>
        `;
        return;
      }

      grid.innerHTML = '';

      list.forEach(c=>{
        const card = document.createElement('article');
        card.className = 'sb-community-card';

        const title = document.createElement('h2');
        title.textContent = c.name;

        const desc = document.createElement('p');
        desc.textContent = c.description || 'Описание сообщества пока не добавлено.';

        const btn = document.createElement('button');
        btn.className = 'sb-community-open';
        btn.textContent = 'Открыть';
        btn.onclick = ()=>window.openCommunity(c.slug);

        card.append(title,desc,btn);
        grid.appendChild(card);
      });

    }catch(e){
      const grid = document.getElementById('sbCommunityGrid');
      if(grid){
        grid.innerHTML = `
          <div class="sb-community-card">
            <h2>Ошибка подключения</h2>
            <p>Не удалось загрузить сообщества.</p>
          </div>
        `;
      }
    }
  };

  const oldOpenCommunity = window.openCommunity;

  window.openCommunity = async function(slug){
    const main = document.querySelector('main');
    if(!main) return;

    main.innerHTML = `
      <section class="sb-community-page">
        <div class="sb-community-top">
          <button class="sb-community-back">← Все сообщества</button>
          <h1>Загрузка...</h1>
          <p></p>
        </div>
        <div id="sbCommunityPosts"></div>
      </section>
    `;

    const back = main.querySelector('.sb-community-back');
    back.onclick = ()=>window.renderCommunitiesScreen();

    try{
      const list = await fetch('/api/communities').then(r=>r.json());
      const c = list.find(x=>x.slug === slug);
      if(!c) throw new Error('not found');

      const top = main.querySelector('.sb-community-top');
      top.querySelector('h1').textContent = c.name;
      top.querySelector('p').textContent = c.description || '';

      const actions = document.createElement('div');
      actions.className = 'sb-community-actions';

      const members = document.createElement('span');
      members.className = 'sb-community-members';
      members.textContent = 'Участники: загрузка...';

      const write = document.createElement('button');
      write.className = 'sb-community-write';
      write.textContent = '+ Написать здесь';
      write.onclick = ()=>{
        window.rebunarPreselect = c.id;
        const items = Array.from(document.querySelectorAll('button,a'));
        const create = items.find(x=>x.textContent.trim()==='+ Создать');
        if(create) create.click();
        else window.showScreen('Создать');
      };

      actions.append(members,write);
      top.append(actions);

      try{
        const mr = await fetch('/api/membership/'+encodeURIComponent(slug));
        const md = await mr.json();

        const join = document.createElement('button');
        join.className = 'sb-community-open';
        join.textContent = md.joined ? 'Выйти' : 'Вступить';

        const updateMembership = d=>{
          members.textContent = 'Участники: '+d.count;
          join.textContent = d.joined ? 'Выйти' : 'Вступить';
        };

        updateMembership(md);

        join.onclick = async ()=>{
          join.disabled = true;
          try{
            const r = await fetch('/api/'+(md.joined ? 'leave/' : 'join/')+encodeURIComponent(slug),{method:'POST'});
            const d = await r.json();
            if(r.ok){
              md.joined = d.joined;
              md.count = d.count;
              updateMembership(md);
            }
          }finally{
            join.disabled = false;
          }
        };

        actions.append(join);
      }catch(e){}

      const pr = await fetch('/api/posts?community='+encodeURIComponent(slug));
      if(!pr.ok) throw new Error('posts');
      const posts = await pr.json();

      const postsBox = document.getElementById('sbCommunityPosts');

      if(!posts.length){
        postsBox.innerHTML = `
          <article class="sb-community-post">
            <h2>Здесь пока пусто</h2>
            <p>Стань первым, кто создаст публикацию в этом сообществе.</p>
          </article>
        `;
        return;
      }

      posts.forEach(post=>{
        const article = document.createElement('article');
        article.className = 'sb-community-post';

        const author = document.createElement('small');
        author.textContent = 'Автор: '+(post.author || 'Автор неизвестен');

        const title = document.createElement('h2');
        title.textContent = post.title || 'Публикация';

        const body = document.createElement('p');
        body.textContent = post.body || '';

        const date = document.createElement('small');
        date.textContent = post.created_at || '';

        article.append(author,title,body,date);
        postsBox.append(article);
      });

    }catch(e){
      main.innerHTML = `
        <section class="sb-community-page">
          <div class="sb-community-top">
            <button class="sb-community-back">← Все сообщества</button>
            <h1>Не удалось открыть сообщество</h1>
            <p>Проверь соединение с сервером.</p>
          </div>
        </section>
      `;
      main.querySelector('.sb-community-back').onclick = ()=>window.renderCommunitiesScreen();
    }
  };
})();
</script>

<script>
(function(){

  window.renderMessagesScreen = async function(){

    const main = document.querySelector('main');
    if(!main) return;

    main.innerHTML = `
      <section class="sb-messages-page">
        <div class="sb-messages-head">
          <h1 class="sb-messages-title">Сообщения</h1>
          <button class="sb-messages-new" id="sbMessagesNew">+</button>
        </div>

        <input
          class="sb-messages-search"
          id="sbMessagesSearch"
          type="text"
          placeholder="Поиск по сообщениям..."
          autocomplete="off"
        >

        <div class="sb-dialogs" id="sbDialogs">
          <div class="sb-messages-empty">
            <strong>Загрузка диалогов...</strong>
            <span>Получаем ваши сообщения</span>
          </div>
        </div>
      </section>
    `;

    const box = document.getElementById('sbDialogs');
    const search = document.getElementById('sbMessagesSearch');

    let chats = [];

    function avatarHTML(chat){
      if(chat.avatar){
        return '<img src="' + chat.avatar.replace(/"/g,'&quot;') + '" alt="">';
      }

      const name = chat.display_name || chat.username || '?';
      return name.slice(0,1).toUpperCase();
    }

    function render(filter=''){
      const q = filter.trim().toLowerCase();

      const visible = chats.filter(chat=>{
        const name = String(chat.display_name || chat.username || '').toLowerCase();
        const text = String(chat.last_message || '').toLowerCase();
        return !q || name.includes(q) || text.includes(q);
      });

      box.innerHTML='';

      if(!visible.length){
        box.innerHTML = `
          <div class="sb-messages-empty">
            <strong>${chats.length ? 'Ничего не найдено' : 'Сообщений пока нет'}</strong>
            <span>${chats.length ? 'Попробуйте изменить запрос' : 'Когда начнётся переписка, она появится здесь'}</span>
          </div>
        `;
        return;
      }

      visible.forEach(chat=>{
        const wrap=document.createElement('div');
        wrap.style.cssText='position:relative;overflow:hidden;border-radius:14px;margin:8px 0;touch-action:pan-y;';

        const remove=document.createElement('button');
        remove.type='button';
        remove.textContent='🗑';
        remove.setAttribute('aria-label','Удалить диалог');
        remove.style.cssText='position:absolute;left:0;top:0;bottom:0;width:68px;border:0;border-radius:12px;background:#9f1828;color:white;font-size:22px;';

        const row=document.createElement('div');
        row.className='sb-dialog';
        row.style.cssText='position:relative;transform:translateX(0);transition:transform .2s ease;';

        const avatar=document.createElement('div');
        avatar.className='sb-dialog-avatar';
        avatar.innerHTML=avatarHTML(chat);

        const content=document.createElement('div');
        content.className='sb-dialog-main';

        const top=document.createElement('div');
        top.className='sb-dialog-top';

        const name=document.createElement('div');
        name.className='sb-dialog-name';
        name.textContent=chat.display_name || chat.username;

        const time=document.createElement('div');
        time.className='sb-dialog-time';
        time.textContent=chat.created_at || '';

        const preview=document.createElement('div');
        preview.className='sb-dialog-preview';
        preview.textContent=chat.last_message || '';

        top.append(name,time);
        content.append(top,preview);

        const arrow=document.createElement('div');
        arrow.className='sb-dialog-arrow';
        arrow.textContent='›';

        row.append(avatar,content,arrow);
        wrap.append(remove,row);
        box.appendChild(wrap);

        let startX=0,startY=0,offset=0,horizontal=false,suppressClick=false;

        row.addEventListener('touchstart',e=>{
          startX=e.touches[0].clientX;
          startY=e.touches[0].clientY;
          horizontal=false;
          suppressClick=false;
          row.style.transition='none';
        },{passive:true});

        row.addEventListener('touchmove',e=>{
          const dx=e.touches[0].clientX-startX;
          const dy=e.touches[0].clientY-startY;
          if(!horizontal && Math.abs(dx)>8 && Math.abs(dx)>Math.abs(dy)) horizontal=true;
          if(horizontal){
            const next=Math.max(0,Math.min(68,offset+dx));
            row.style.transform='translateX('+next+'px)';
          }
        },{passive:true});

        row.addEventListener('touchend',()=>{
          if(horizontal){
            const match=row.style.transform.match(/translateX\(([-\d.]+)px\)/);
            const current=match ? Number(match[1]) : offset;
            offset=current>=34 ? 68 : 0;
            suppressClick=true;
          }
          row.style.transition='transform .2s ease';
          row.style.transform='translateX('+offset+'px)';
        });

        row.onclick=()=>{
          if(suppressClick){suppressClick=false;return;}
          if(offset>0){
            offset=0;
            row.style.transform='translateX(0)';
            return;
          }
          window.openDirectChat(chat.user_id,chat.display_name || chat.username);
        };

        remove.onclick=async()=>{
          if(!confirm('Убрать диалог из списка? История сообщений сохранится.')) return;
          remove.disabled=true;
          try{
            const response=await fetch('/api/messages/chats/'+chat.user_id,{method:'DELETE'});
            if(!response.ok) throw new Error('HTTP '+response.status);
            chats=chats.filter(item=>Number(item.user_id)!==Number(chat.user_id));
            render(search.value);
          }catch(error){
            console.error(error);
            remove.disabled=false;
            alert('Не удалось убрать диалог.');
          }
        };
      });

      search.oninput=()=>render(search.value);

    document.getElementById('sbMessagesNew').onclick=()=>{
      alert('Поиск пользователей для нового диалога добавим следующим шагом.');
    };
  };

  const previousShow=window.showScreen;

  window.showScreen=function(name){
    if(String(name).includes('Сообщения') || String(name).includes('Чат')){
      window.renderMessagesScreen();
      return;
    }

    return previousShow(name);
  };

})();
</script>

<script>
window.openNewDirectChat=function(){
  const old=document.querySelector('.sb-newchat-overlay');
  if(old) old.remove();

  const overlay=document.createElement('div');
  overlay.className='sb-newchat-overlay';

  overlay.innerHTML=`
    <div class="sb-newchat-box">
      <div class="sb-newchat-head">
        <div class="sb-newchat-title">Новый чат</div>
        <button class="sb-newchat-close" type="button">×</button>
      </div>
      <input class="sb-newchat-search" placeholder="Поиск пользователя..." autocomplete="off">
      <div class="sb-newchat-results">
        <div class="sb-newchat-hint">Начни вводить имя пользователя</div>
      </div>
    </div>
  `;

  document.body.appendChild(overlay);

  const input=overlay.querySelector('.sb-newchat-search');
  const results=overlay.querySelector('.sb-newchat-results');

  overlay.querySelector('.sb-newchat-close').onclick=()=>overlay.remove();

  overlay.onclick=e=>{
    if(e.target===overlay) overlay.remove();
  };

  let timer=null;

  input.oninput=function(){
    clearTimeout(timer);
    const q=input.value.trim();

    if(q.length<1){
      results.innerHTML='<div class="sb-newchat-hint">Начни вводить имя пользователя</div>';
      return;
    }

    results.innerHTML='<div class="sb-newchat-hint">Поиск...</div>';

    timer=setTimeout(async()=>{
      try{
        const r=await fetch('/api/users/search?q='+encodeURIComponent(q));
        const data=await r.json();

        if(!r.ok){
          results.innerHTML='<div class="sb-newchat-hint">Войдите в аккаунт</div>';
          return;
        }

        if(!data.length){
          results.innerHTML='<div class="sb-newchat-hint">Пользователь не найден</div>';
          return;
        }

        results.innerHTML=data.map(u=>{
          const avatar=u.avatar
            ? '<img class="sb-user-avatar" src="'+u.avatar+'">'
            : '<div class="sb-user-avatar"></div>';

          return `
            <div class="sb-user-result"
                 data-id="${u.id}"
                 data-username="${String(u.display_name||u.username).replace(/"/g,'&quot;')}">
              ${avatar}
              <div>
                <div class="sb-user-name">${u.display_name||u.username}</div>
                <div class="sb-user-login">@${u.username}</div>
              </div>
            </div>
          `;
        }).join('');

        results.querySelectorAll('.sb-user-result').forEach(row=>{
          row.onclick=()=>{
            overlay.remove();
            if(window.openDirectChat){
              window.openDirectChat(
                Number(row.dataset.id),
                row.dataset.username
              );
            }
          };
        });

      }catch(e){
        results.innerHTML='<div class="sb-newchat-hint">Ошибка поиска</div>';
      }
    },250);
  };

  input.focus();
};
</script>
<script>
(function(){
  function bindNewChatButton(){
    const page=document.querySelector('.sb-messages-page');
    if(!page) return;

    const buttons=page.querySelectorAll('button');
    buttons.forEach(btn=>{
      const text=(btn.textContent||'').trim();
      if(text==='+' || text.includes('Новый')){
        btn.onclick=function(e){
          e.preventDefault();
          e.stopPropagation();
          if(window.openNewDirectChat) window.openNewDirectChat();
        };
      }
    });
  }

  const oldRender=window.renderMessagesScreen;
  if(oldRender){
    window.renderMessagesScreen=async function(){
      await oldRender();
      setTimeout(bindNewChatButton,100);
    };
  }
})();
</script>

<script>
(function(){
  function addSelfNotes(){
    const page=document.querySelector('.sb-messages-page');
    if(!page) return;
    if(page.querySelector('.sb-self-notes')) return;

    const dialogs=page.querySelector('.sb-dialogs');
    if(!dialogs) return;

    const item=document.createElement('div');
    item.className='sb-self-notes';
    item.innerHTML=`
      <div class="sb-self-notes-avatar">🔖</div>
      <div class="sb-self-notes-main">
        <div class="sb-self-notes-name">Заметки для себя</div>
        <div class="sb-self-notes-preview">Личные заметки и сохранённые сообщения</div>
      </div>
    `;

    item.onclick=function(){
      if(window.openSelfNotes) window.openSelfNotes();
    };

    dialogs.prepend(item);
  }

  const oldRender=window.renderMessagesScreen;
  if(oldRender){
    window.renderMessagesScreen=async function(){
      await oldRender();
      setTimeout(addSelfNotes,100);
    };
  }

  window.openSelfNotes=async function(){
    const main=document.querySelector('main');
    if(!main) return;

    main.innerHTML=`
      <section class="sb-messages-page">
        <div class="sb-messages-head">
          <button class="sb-messages-new" onclick="window.renderMessagesScreen()">←</button>
          <div class="sb-messages-title">🔖 Заметки для себя</div>
        </div>

        <div id="sb-self-chat"
             style="height:55vh;overflow-y:auto;padding:12px 4px;"></div>

        <div id="sb-photo-preview" style="display:none;margin:10px 0;">
          <img id="sb-photo-preview-img"
               style="max-width:150px;max-height:150px;border-radius:10px;border:1px solid #8f2635;">
          <button id="sb-photo-cancel" class="sb-messages-new"
                  style="margin-left:8px;">✕</button>
        </div>

        <input id="sb-self-file" type="file"
               accept="image/jpeg,image/png,image/webp" hidden>

        <div style="display:flex;gap:8px;margin-top:12px;align-items:center;">
          <button id="sb-self-add" class="sb-messages-new"
                  style="width:48px;font-size:22px;">+</button>
          <input id="sb-self-input"
                 placeholder="Написать заметку..."
                 style="flex:1;min-width:0;padding:13px;border-radius:9px;border:1px solid rgba(190,25,45,.4);background:#0b0c0e;color:#fff;outline:none;">
          <button id="sb-self-send" class="sb-messages-new"
                  style="width:52px;">➤</button>
        </div>
        <div id="sb-self-status" style="font-size:12px;color:#aaa;margin-top:7px;"></div>
      </section>
    `;

    const box=document.getElementById('sb-self-chat');
    const input=document.getElementById('sb-self-input');
    const send=document.getElementById('sb-self-send');
    const file=document.getElementById('sb-self-file');
    const add=document.getElementById('sb-self-add');
    const preview=document.getElementById('sb-photo-preview');
    const previewImg=document.getElementById('sb-photo-preview-img');
    const cancel=document.getElementById('sb-photo-cancel');
    const status=document.getElementById('sb-self-status');
    let selectedPhoto=null;

    function escapeText(value){
      return String(value ?? '').replace(/[&<>"']/g,c=>({
        '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'
      }[c]));
    }

    async function load(){
      const r=await fetch('/api/messages/self');
      const data=await r.json();

      if(!r.ok){
        box.innerHTML='<div class="sb-newchat-hint">Войдите в аккаунт</div>';
        return;
      }

      box.innerHTML=data.length
        ? data.map(m=>`
            <div style="display:flex;justify-content:flex-end;align-items:flex-start;gap:7px;margin:9px 0;">
              <button data-delete-note="${m.id}" title="Удалить заметку"
                      style="flex-shrink:0;background:transparent;border:0;color:#a66b73;padding:8px;cursor:pointer;">✕</button>
              <div style="max-width:82%;padding:10px 13px;border-radius:12px 12px 3px 12px;background:#40101a;color:#f5e5e7;border:1px solid rgba(190,25,45,.3);">
                ${m.image_url ? `<img src="${escapeText(m.image_url)}" onclick="window.open(this.src,'_blank')" style="display:block;max-width:100%;max-height:260px;border-radius:8px;margin-bottom:6px;cursor:pointer;">` : ''}
                ${m.text && m.text !== '[Фото]' ? escapeText(m.text).replace(/\n/g,'<br>') : ''}
              </div>
            </div>
          `).join('')
        : '<div class="sb-newchat-hint">Здесь можно хранить свои заметки</div>';

      box.querySelectorAll('[data-delete-note]').forEach(button=>{
        button.onclick=async()=>{
          if(!confirm('Удалить эту заметку?')) return;
          button.disabled=true;
          try{
            const r=await fetch('/api/messages/self/'+button.dataset.deleteNote,{
              method:'DELETE'
            });
            const result=await r.json();
            if(!r.ok) throw new Error(result.error || 'Не удалось удалить');
            status.textContent='Заметка удалена.';
            await load();
          }catch(e){
            button.disabled=false;
            status.textContent=e.message || 'Ошибка удаления.';
          }
        };
      });

      box.scrollTop=box.scrollHeight;
    }

    add.onclick=()=>file.click();

    file.onchange=()=>{
      const photo=file.files[0];
      if(!photo) return;

      if(photo.size>10*1024*1024){
        status.textContent='Фотография больше 10 МБ.';
        file.value='';
        return;
      }

      selectedPhoto=photo;
      previewImg.src=URL.createObjectURL(photo);
      preview.style.display='block';
      status.textContent='Фото готово к отправке.';
    };

    cancel.onclick=()=>{
      selectedPhoto=null;
      file.value='';
      preview.style.display='none';
      previewImg.removeAttribute('src');
      status.textContent='';
    };

    async function sendNote(){
      const text=input.value.trim();
      if(!text && !selectedPhoto) return;

      send.disabled=true;
      add.disabled=true;
      status.textContent='Отправка...';

      try{
        if(selectedPhoto){
          const form=new FormData();
          form.append('image',selectedPhoto);

          const r=await fetch('/api/messages/self/image',{
            method:'POST',
            body:form
          });
          const data=await r.json();
          if(!r.ok) throw new Error(data.error || 'Не удалось загрузить фото');

          selectedPhoto=null;
          file.value='';
          preview.style.display='none';
          previewImg.removeAttribute('src');
        }

        if(text){
          const r=await fetch('/api/messages/self',{
            method:'POST',
            headers:{'Content-Type':'application/json'},
            body:JSON.stringify({text})
          });
          const data=await r.json();
          if(!r.ok) throw new Error(data.error || 'Не удалось сохранить заметку');
          input.value='';
        }

        status.textContent='Сохранено.';
        await load();
      }catch(e){
        status.textContent=e.message || 'Ошибка отправки.';
      }finally{
        send.disabled=false;
        add.disabled=false;
      }
    }

    send.onclick=sendNote;
    input.onkeydown=e=>{
      if(e.key==='Enter') sendNote();
    };

    await load();
    input.focus();
  };
})();
</script>

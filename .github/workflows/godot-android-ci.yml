name: Godot Android integration check

on:
  push:
    branches:
      - feature/godot-android-runtime
    paths:
      - "android-rebunar/**"
      - ".github/workflows/godot-android-ci.yml"

permissions:
  contents: read

jobs:
  build-debug-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Build Android debug APK with embedded Godot
        run: gradle -p android-rebunar :app:assembleDebug

      - name: Verify Godot project assets are packaged
        run: |
          test -s android-rebunar/app/build/outputs/apk/debug/app-debug.apk
          unzip -l android-rebunar/app/build/outputs/apk/debug/app-debug.apk | grep -q 'assets/project.godot'
          unzip -l android-rebunar/app/build/outputs/apk/debug/app-debug.apk | grep -q 'assets/main.gd'

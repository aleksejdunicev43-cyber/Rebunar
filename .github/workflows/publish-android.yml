name: Publish Rebunar Android APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/publish-android.yml"
      - "frontend/**"
      - "package.json"
      - "package-lock.json"
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/publish-android.yml"
      - "frontend/**"
      - "package.json"
      - "package-lock.json"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout current Rebunar repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Build trusted Rebunar frontend
        run: |
          npm ci
          npm run build
          test -s frontend/build/index.html
          # Fail the release if the canonical frontend does not contain the current store.
          grep -R -q 'ChatGPT' frontend/build/assets
          grep -R -q 'store-chatgpt-preview' frontend/build/assets
          printf '{"version":"0.2.3","commit":"%s"}\n' "$GITHUB_SHA" > frontend/build/rebunar-build.json
          cd frontend/build
          zip -qr ../../rebunar-web-build.zip .
          cd ../..

      - name: Checkout Android application source
        uses: actions/checkout@v4
        with:
          ref: 2282873e5b8b6558ad5cf62816df916123e574c2
          path: android-source

      - name: Prepare Android project and bundle frontend
        run: |
          cp -R android-source/android-rebunar ./android-rebunar
          cp android-source/rebunar_avatar.png ./rebunar_avatar.png
          python - <<'PY'
          from pathlib import Path
          import os
          import re
          is_preview = os.environ.get("GITHUB_EVENT_NAME") == "pull_request"
          version_code = 11 if is_preview else 10
          version_name = "0.2.4-test" if is_preview else "0.2.3"
          gradle_file = Path("android-rebunar/app/build.gradle.kts")
          text = gradle_file.read_text()
          text, code_count = re.subn(r"versionCode = \d+", f"versionCode = {version_code}", text, count=1)
          text, name_count = re.subn(r'versionName = "[^"]+"', f'versionName = "{version_name}"', text, count=1)
          if code_count != 1 or name_count != 1:
              raise SystemExit("Could not set the intended Android version.")
          gradle_file.write_text(text)
          build_metadata = Path("frontend/build/rebunar-build.json")
          build_metadata.write_text(
              f'{{"version":"{version_name}","commit":"{os.environ["GITHUB_SHA"]}"}}\\n'
          )
          PY
          mkdir -p android-rebunar/app/src/main/assets/build
          cp -R frontend/build/. android-rebunar/app/src/main/assets/build/
          test -s android-rebunar/app/src/main/assets/build/index.html
          grep -R -q 'ChatGPT' android-rebunar/app/src/main/assets/build/assets
          grep -R -q 'store-chatgpt-preview' android-rebunar/app/src/main/assets/build/assets

      - name: Verify Android shell and bundled frontend support
        run: |
          grep -q 'serveBundledFrontend' android-rebunar/app/src/main/java/ru/rebunar/app/MainActivity.kt
          grep -q 'minSdk = 24' android-rebunar/app/build.gradle.kts

      - name: Prepare application icon
        run: |
          rm -f android-rebunar/app/src/main/res/drawable/rebunar_logo.xml
          python -m pip install Pillow numpy
          python - <<'PY'
          from PIL import Image, ImageDraw, ImageFilter, ImageChops
          import numpy as np
          source = Image.open("rebunar_avatar.png").convert("RGBA")
          pixels = np.asarray(source.convert("RGB"))
          red, green, blue = pixels[:,:,0], pixels[:,:,1], pixels[:,:,2]
          green_ring = (green > 65) & (green > red * 1.22) & (green > blue * 1.12)
          if int(green_ring.sum()) < 100:
              raise RuntimeError("Could not detect the original circular logo rim.")
          artwork = source.copy()
          artwork.thumbnail((448, 448), Image.Resampling.LANCZOS)
          logo = Image.new("RGBA", (512, 512), (7, 9, 8, 255))
          logo.alpha_composite(artwork, ((512-artwork.width)//2, (512-artwork.height)//2))
          mask = Image.new("L", (512, 512), 0)
          ImageDraw.Draw(mask).ellipse((1, 1, 510, 510), fill=255)
          logo.putalpha(mask)
          glow = Image.new("RGBA", (512, 512), (0, 0, 0, 0))
          ImageDraw.Draw(glow).ellipse((4.5, 4.5, 507.5, 507.5), outline=(35,255,75,150), width=5)
          logo = Image.alpha_composite(logo, glow.filter(ImageFilter.GaussianBlur(3)))
          ImageDraw.Draw(logo).ellipse((5.5, 5.5, 506.5, 506.5), outline=(95,255,115,245), width=2)
          logo.putalpha(ImageChops.multiply(logo.getchannel("A"), mask))
          logo.save("android-rebunar/app/src/main/res/drawable/rebunar_logo.png", optimize=True)
          PY

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Prepare persistent APK signing key
        env:
          REBUNAR_KEYSTORE_BASE64: ${{ secrets.REBUNAR_KEYSTORE_BASE64 }}
        run: |
          test -n "$REBUNAR_KEYSTORE_BASE64" || {
            echo "Add the REBUNAR_KEYSTORE_BASE64 repository secret before publishing."
            exit 1
          }
          echo "$REBUNAR_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/rebunar-signing.jks"
          test -s "$RUNNER_TEMP/rebunar-signing.jks"
          echo "REBUNAR_KEYSTORE_PATH=$RUNNER_TEMP/rebunar-signing.jks" >> "$GITHUB_ENV"

      - name: Build release APK
        env:
          REBUNAR_KEYSTORE_PASSWORD: ${{ secrets.REBUNAR_KEYSTORE_PASSWORD }}
          REBUNAR_KEY_ALIAS: ${{ secrets.REBUNAR_KEY_ALIAS }}
          REBUNAR_KEY_PASSWORD: ${{ secrets.REBUNAR_KEY_PASSWORD }}
        run: |
          test -n "$REBUNAR_KEYSTORE_PASSWORD"
          test -n "$REBUNAR_KEY_ALIAS"
          test -n "$REBUNAR_KEY_PASSWORD"
          gradle -p android-rebunar :app:assembleRelease

      - name: Verify bundled frontend assets
        run: |
          APK=android-rebunar/app/build/outputs/apk/release/app-release.apk
          test -s "$APK"
          unzip -l "$APK" | grep -q 'assets/build/index.html'
          mkdir -p /tmp/rebunar-apk-check
          unzip -q "$APK" 'assets/build/*' -d /tmp/rebunar-apk-check
          grep -R -q 'ChatGPT' /tmp/rebunar-apk-check/assets/build/assets
          grep -R -q 'store-chatgpt-preview' /tmp/rebunar-apk-check/assets/build/assets
          test -s /tmp/rebunar-apk-check/assets/build/rebunar-build.json
          cat /tmp/rebunar-apk-check/assets/build/rebunar-build.json
          APKSIGNER="$ANDROID_HOME/build-tools/$(ls "$ANDROID_HOME/build-tools" | sort -V | tail -n 1)/apksigner"
          "$APKSIGNER" verify --verbose --print-certs "$APK" | tee /tmp/rebunar-apk-signature.txt
          ! grep -qi 'CN=Android Debug' /tmp/rebunar-apk-signature.txt

      - name: Upload APK build artifact
        uses: actions/upload-artifact@v4
        with:
          name: rebunar-android-preview
          path: |
            android-rebunar/app/build/outputs/apk/release/app-release.apk
            rebunar-web-build.zip
          if-no-files-found: error
          retention-days: 14

      - name: Deploy the exact frontend build to PythonAnywhere
        if: github.event_name != 'pull_request'
        env:
          PYTHONANYWHERE_API_TOKEN: ${{ secrets.PYTHONANYWHERE_API_TOKEN }}
          PYTHONANYWHERE_API_HOST: ${{ secrets.PYTHONANYWHERE_API_HOST }}
        run: |
          if [ -z "$PYTHONANYWHERE_API_TOKEN" ] || [ -z "$PYTHONANYWHERE_API_HOST" ]; then
            echo "::warning::Website auto-deploy skipped. Configure PYTHONANYWHERE_API_TOKEN and PYTHONANYWHERE_API_HOST in GitHub Actions secrets."
            exit 0
          fi
          python -m pip install requests
          python - <<'PY'
          import os
          from pathlib import Path
          from urllib.parse import quote
          import requests

          username = "rebunar"
          domain = "rebunar.pythonanywhere.com"
          target = Path("/home/rebunar/rebunar_next/frontend/build")
          api_host = os.environ["PYTHONANYWHERE_API_HOST"].rstrip("/")
          headers = {"Authorization": "Token " + os.environ["PYTHONANYWHERE_API_TOKEN"]}
          files = sorted(path for path in Path("frontend/build").rglob("*") if path.is_file())
          if not files:
              raise SystemExit("Frontend build is empty; refusing website deployment.")

          for source in files:
              relative = source.relative_to("frontend/build").as_posix()
              remote_path = str(target / relative)
              endpoint = (
                  f"{api_host}/api/v0/user/{username}/files/path"
                  + quote(remote_path, safe="/")
              )
              with source.open("rb") as stream:
                  response = requests.post(
                      endpoint,
                      headers=headers,
                      files={"content": (source.name, stream)},
                      timeout=60,
                  )
              if response.status_code not in (200, 201):
                  raise SystemExit(
                      f"PythonAnywhere upload failed for {relative}: "
                      f"{response.status_code} {response.text[:500]}"
                  )
              print(f"Uploaded {relative}")

          reload_url = (
              f"{api_host}/api/v0/user/{username}/webapps/{domain}/reload/"
          )
          response = requests.post(reload_url, headers=headers, timeout=60)
          if response.status_code not in (200, 201, 202):
              raise SystemExit(
                  f"PythonAnywhere reload failed: {response.status_code} "
                  f"{response.text[:500]}"
              )
          print("PythonAnywhere website reloaded with the same frontend build.")
          PY

      - name: Publish APK release
        if: github.event_name != 'pull_request'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v0.2.3
          name: Rebunar Android 0.2.3
          target_commitish: main
          generate_release_notes: true
          make_latest: true
          files: |
            android-rebunar/app/build/outputs/apk/release/app-release.apk
            rebunar-web-build.zip
          fail_on_unmatched_files: true

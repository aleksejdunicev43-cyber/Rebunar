name: Publish Rebunar Android APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/publish-android.yml"
      - "frontend/features/studio/view.js"
      - "frontend/features/studio/studio.css"
      - "package.json"
      - "package-lock.json"
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/publish-android.yml"
      - "frontend/features/studio/view.js"
      - "frontend/features/studio/studio.css"
      - "package.json"
      - "package-lock.json"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout current Rebunar repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Build trusted Rebunar frontend
        run: |
          npm ci
          npm run build
          test -s frontend/build/index.html
          grep -R -q 'rebunar://studio/godot' frontend/build/assets

      - name: Checkout Android application source
        uses: actions/checkout@v4
        with:
          ref: feature/android-bundled-frontend
          path: android-source

      - name: Prepare Android project and bundle frontend
        run: |
          cp -R android-source/android-rebunar ./android-rebunar
          cp android-source/rebunar_avatar.png ./rebunar_avatar.png
          mkdir -p android-rebunar/app/src/main/assets/build
          cp -R frontend/build/. android-rebunar/app/src/main/assets/build/
          test -s android-rebunar/app/src/main/assets/build/index.html
          test -s android-rebunar/app/src/main/assets/project.godot
          test -s android-rebunar/app/src/main/assets/main.gd

      - name: Verify Android shell has native Godot and bundled frontend support
        run: |
          grep -q 'serveBundledFrontend' android-rebunar/app/src/main/java/ru/rebunar/app/MainActivity.kt
          grep -q 'uri.scheme == "rebunar"' android-rebunar/app/src/main/java/ru/rebunar/app/MainActivity.kt
          grep -q 'uri.host == "studio"' android-rebunar/app/src/main/java/ru/rebunar/app/MainActivity.kt
          grep -q 'uri.path == "/godot"' android-rebunar/app/src/main/java/ru/rebunar/app/MainActivity.kt
          grep -q 'org.godotengine:godot:4.7.2.stable' android-rebunar/app/build.gradle.kts
          grep -q 'minSdk = 24' android-rebunar/app/build.gradle.kts


      - name: Prepare application icon
        run: |
          python -m pip install Pillow numpy
          python - <<'PY'
          from PIL import Image, ImageDraw, ImageFilter, ImageChops
          import numpy as np
          source = Image.open("rebunar_avatar.png").convert("RGBA")
          pixels = np.asarray(source.convert("RGB"))
          red, green, blue = pixels[:,:,0], pixels[:,:,1], pixels[:,:,2]
          green_ring = (green > 65) & (green > red * 1.22) & (green > blue * 1.12)
          if int(green_ring.sum()) < 100:
              raise RuntimeError("Could not detect the original circular logo rim.")
          artwork = source.copy()
          artwork.thumbnail((448, 448), Image.Resampling.LANCZOS)
          logo = Image.new("RGBA", (512, 512), (7, 9, 8, 255))
          logo.alpha_composite(artwork, ((512-artwork.width)//2, (512-artwork.height)//2))
          mask = Image.new("L", (512, 512), 0)
          ImageDraw.Draw(mask).ellipse((1, 1, 510, 510), fill=255)
          logo.putalpha(mask)
          glow = Image.new("RGBA", (512, 512), (0, 0, 0, 0))
          ImageDraw.Draw(glow).ellipse((4.5, 4.5, 507.5, 507.5), outline=(35,255,75,150), width=5)
          logo = Image.alpha_composite(logo, glow.filter(ImageFilter.GaussianBlur(3)))
          ImageDraw.Draw(logo).ellipse((5.5, 5.5, 506.5, 506.5), outline=(95,255,115,245), width=2)
          logo.putalpha(ImageChops.multiply(logo.getchannel("A"), mask))
          logo.save("android-rebunar/app/src/main/res/drawable/rebunar_logo.png", optimize=True)
          PY

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Build release APK
        run: gradle -p android-rebunar :app:assembleDebug

      - name: Verify embedded Godot and bundled frontend assets
        run: |
          APK=android-rebunar/app/build/outputs/apk/debug/app-debug.apk
          test -s "$APK"
          unzip -l "$APK" | grep -q 'assets/project.godot'
          unzip -l "$APK" | grep -q 'assets/main.gd'
          unzip -l "$APK" | grep -q 'assets/build/index.html'
          unzip -l "$APK" | grep -q 'lib/arm64-v8a/libgodot_android.so'
          unzip -l "$APK" | grep -q 'lib/armeabi-v7a/libgodot_android.so'
          if unzip -l "$APK" | grep -Eq 'lib/(x86|x86_64)/libgodot_android.so'; then
            echo "Unexpected x86 Godot engine binary found in ARM-only APK"
            exit 1
          fi

      - name: Upload APK build artifact
        uses: actions/upload-artifact@v4
        with:
          name: rebunar-android-arm32-arm64-preview
          path: android-rebunar/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14

      - name: Publish APK release
        if: github.event_name != 'pull_request'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v0.1.5
          name: Rebunar Android 0.1.5
          target_commitish: main
          generate_release_notes: true
          make_latest: true
          files: android-rebunar/app/build/outputs/apk/debug/app-debug.apk
          fail_on_unmatched_files: true

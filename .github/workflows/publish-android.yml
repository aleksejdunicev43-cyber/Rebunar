name: Publish Rebunar Android APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/publish-android.yml"
      - "frontend/**"
      - "package.json"
      - "package-lock.json"
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/publish-android.yml"
      - "frontend/**"
      - "package.json"
      - "package-lock.json"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout current Rebunar repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Build trusted Rebunar frontend
        run: |
          npm ci
          npm run build
          test -s frontend/build/index.html

      - name: Checkout Android application source
        uses: actions/checkout@v4
        with:
          ref: feature/android-bundled-frontend
          path: android-source

      - name: Prepare Android project and bundle frontend
        run: |
          cp -R android-source/android-rebunar ./android-rebunar
          cp android-source/rebunar_avatar.png ./rebunar_avatar.png
          mkdir -p android-rebunar/app/src/main/assets/build
          cp -R frontend/build/. android-rebunar/app/src/main/assets/build/
          test -s android-rebunar/app/src/main/assets/build/index.html

      - name: Verify Android shell and bundled frontend support
        run: |
          grep -q 'serveBundledFrontend' android-rebunar/app/src/main/java/ru/rebunar/app/MainActivity.kt
          grep -q 'minSdk = 24' android-rebunar/app/build.gradle.kts

      - name: Prepare application icon
        run: |
          rm -f android-rebunar/app/src/main/res/drawable/rebunar_logo.xml
          python -m pip install Pillow numpy
          python - <<'PY'
          from PIL import Image, ImageDraw, ImageFilter, ImageChops
          import numpy as np
          source = Image.open("rebunar_avatar.png").convert("RGBA")
          pixels = np.asarray(source.convert("RGB"))
          red, green, blue = pixels[:,:,0], pixels[:,:,1], pixels[:,:,2]
          green_ring = (green > 65) & (green > red * 1.22) & (green > blue * 1.12)
          if int(green_ring.sum()) < 100:
              raise RuntimeError("Could not detect the original circular logo rim.")
          artwork = source.copy()
          artwork.thumbnail((448, 448), Image.Resampling.LANCZOS)
          logo = Image.new("RGBA", (512, 512), (7, 9, 8, 255))
          logo.alpha_composite(artwork, ((512-artwork.width)//2, (512-artwork.height)//2))
          mask = Image.new("L", (512, 512), 0)
          ImageDraw.Draw(mask).ellipse((1, 1, 510, 510), fill=255)
          logo.putalpha(mask)
          glow = Image.new("RGBA", (512, 512), (0, 0, 0, 0))
          ImageDraw.Draw(glow).ellipse((4.5, 4.5, 507.5, 507.5), outline=(35,255,75,150), width=5)
          logo = Image.alpha_composite(logo, glow.filter(ImageFilter.GaussianBlur(3)))
          ImageDraw.Draw(logo).ellipse((5.5, 5.5, 506.5, 506.5), outline=(95,255,115,245), width=2)
          logo.putalpha(ImageChops.multiply(logo.getchannel("A"), mask))
          logo.save("android-rebunar/app/src/main/res/drawable/rebunar_logo.png", optimize=True)
          PY

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Prepare persistent APK signing key
        env:
          REBUNAR_KEYSTORE_BASE64: ${{ secrets.REBUNAR_KEYSTORE_BASE64 }}
        run: |
          test -n "$REBUNAR_KEYSTORE_BASE64" || {
            echo "Add the REBUNAR_KEYSTORE_BASE64 repository secret before publishing."
            exit 1
          }
          echo "$REBUNAR_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/rebunar-signing.jks"
          test -s "$RUNNER_TEMP/rebunar-signing.jks"
          echo "REBUNAR_KEYSTORE_PATH=$RUNNER_TEMP/rebunar-signing.jks" >> "$GITHUB_ENV"

      - name: Build release APK
        env:
          REBUNAR_KEYSTORE_PASSWORD: ${{ secrets.REBUNAR_KEYSTORE_PASSWORD }}
          REBUNAR_KEY_ALIAS: ${{ secrets.REBUNAR_KEY_ALIAS }}
          REBUNAR_KEY_PASSWORD: ${{ secrets.REBUNAR_KEY_PASSWORD }}
        run: |
          test -n "$REBUNAR_KEYSTORE_PASSWORD"
          test -n "$REBUNAR_KEY_ALIAS"
          test -n "$REBUNAR_KEY_PASSWORD"
          gradle -p android-rebunar :app:assembleDebug

      - name: Verify bundled frontend assets
        run: |
          APK=android-rebunar/app/build/outputs/apk/debug/app-debug.apk
          test -s "$APK"
          unzip -l "$APK" | grep -q 'assets/build/index.html'

      - name: Prepare Android emulator evidence folder
        run: mkdir -p artifacts/android-emulator

      - name: Launch APK in Android emulator and capture screen
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim
          script: |
            set -euo pipefail
            APK=android-rebunar/app/build/outputs/apk/debug/app-debug.apk
            adb install -r "$APK"
            adb shell am force-stop ru.rebunar.app
            adb shell am start -n ru.rebunar.app/.MainActivity
            sleep 25
            adb shell pidof ru.rebunar.app
            adb shell screencap -p /sdcard/rebunar-android-home.png
            adb pull /sdcard/rebunar-android-home.png artifacts/android-emulator/01-app-start.png
            adb shell uiautomator dump /sdcard/rebunar-window.xml >/dev/null
            adb pull /sdcard/rebunar-window.xml artifacts/android-emulator/02-ui-hierarchy.xml
            adb shell dumpsys activity activities > artifacts/android-emulator/03-activity.txt
            adb logcat -d -t 4000 > artifacts/android-emulator/04-logcat.txt
            python - <<'PY'
            import xml.etree.ElementTree as ET
            from pathlib import Path
            import re, subprocess
            tree = ET.parse("artifacts/android-emulator/02-ui-hierarchy.xml")
            nodes = tree.getroot().iter("node")
            candidates = []
            for node in nodes:
                if node.attrib.get("clickable") != "true":
                    continue
                bounds = node.attrib.get("bounds", "")
                match = re.fullmatch(r"\\[(\\d+),(\\d+)\\]\\[(\\d+),(\\d+)\\]", bounds)
                if not match:
                    continue
                x1, y1, x2, y2 = map(int, match.groups())
                if x2 <= x1 or y2 <= y1:
                    continue
                label = node.attrib.get("text") or node.attrib.get("content-desc") or ""
                candidates.append((x1, y1, x2, y2, label))
            if candidates:
                x1, y1, x2, y2, label = candidates[0]
                x, y = (x1+x2)//2, (y1+y2)//2
                Path("artifacts/android-emulator/05-tap.txt").write_text(
                    f"Tapped first accessible clickable target: {label!r} at ({x},{y})\\n",
                    encoding="utf-8"
                )
                subprocess.run(["adb","shell","input","tap",str(x),str(y)],check=True)
                import time
                time.sleep(3)
                subprocess.run(["adb","shell","screencap","-p","/sdcard/rebunar-after-tap.png"],check=True)
                subprocess.run(["adb","pull","/sdcard/rebunar-after-tap.png","artifacts/android-emulator/06-after-tap.png"],check=True)
            else:
                Path("artifacts/android-emulator/05-tap.txt").write_text(
                    "No accessible clickable target was exposed by UIAutomator.\\n",
                    encoding="utf-8"
                )
            PY

      - name: Upload Android emulator screenshots and logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rebunar-android-emulator-check
          path: artifacts/android-emulator/
          if-no-files-found: warn
          retention-days: 14

      - name: Upload APK build artifact
        uses: actions/upload-artifact@v4
        with:
          name: rebunar-android-preview
          path: android-rebunar/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14

      - name: Publish APK release
        if: github.event_name != 'pull_request'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v0.1.9
          name: Rebunar Android 0.1.9
          target_commitish: main
          generate_release_notes: true
          make_latest: true
          files: android-rebunar/app/build/outputs/apk/debug/app-debug.apk
          fail_on_unmatched_files: true

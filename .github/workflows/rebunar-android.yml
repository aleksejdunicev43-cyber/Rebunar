name: Rebunar Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - feature/rebunar-android-shell
      - feature/android-bundled-frontend
    paths:
      - "android-rebunar/**"
      - ".github/workflows/rebunar-android.yml"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Prepare full circular Rebunar logo
        run: |
          python -m pip install Pillow numpy
          python - <<'PY'
          from PIL import Image, ImageDraw, ImageFilter, ImageChops
          import numpy as np

          source_path = "rebunar_avatar.png"
          output_path = "android-rebunar/app/src/main/res/drawable/rebunar_logo.png"
          source = Image.open(source_path).convert("RGBA")
          pixels = np.asarray(source.convert("RGB"))
          red, green, blue = pixels[:,:,0], pixels[:,:,1], pixels[:,:,2]

          # Verify that the uploaded source still contains its green circular frame.
          green_ring = (green > 65) & (green > red * 1.22) & (green > blue * 1.12)
          if int(green_ring.sum()) < 100:
              raise RuntimeError("Could not reliably detect the green outer circle; refusing to process the logo.")

          # Fit the ENTIRE original image inside the fixed 512px circular icon.
          # This keeps edge details such as the crown and moon visible instead of
          # cropping to the detected green ring. The outer finishing rim stays fixed.
          artwork = source.copy()
          artwork.thumbnail((448, 448), Image.Resampling.LANCZOS)
          logo = Image.new("RGBA", (512, 512), (7, 9, 8, 255))
          offset = ((512 - artwork.width) // 2, (512 - artwork.height) // 2)
          logo.alpha_composite(artwork, offset)

          # Apply a clean circular alpha edge.
          mask = Image.new("L", (512, 512), 0)
          ImageDraw.Draw(mask).ellipse((1, 1, 510, 510), fill=255)
          logo.putalpha(mask)

          # Add a geometrically perfect, consistent neon-green finishing rim.
          # A restrained soft glow keeps the original Steel & Blood / neon look.
          glow = Image.new("RGBA", (512, 512), (0, 0, 0, 0))
          ImageDraw.Draw(glow).ellipse((4.5, 4.5, 507.5, 507.5),
                                       outline=(35, 255, 75, 150), width=5)
          glow = glow.filter(ImageFilter.GaussianBlur(3))
          logo = Image.alpha_composite(logo, glow)
          ImageDraw.Draw(logo).ellipse((5.5, 5.5, 506.5, 506.5),
                                       outline=(95, 255, 115, 245), width=2)

          # Re-apply the circular mask so all four outside corners stay transparent.
          logo.putalpha(ImageChops.multiply(logo.getchannel("A"), mask))
          logo.save(output_path, format="PNG", optimize=True)
          logo.save("rebunar-logo-preview.png", format="PNG", optimize=True)
          print("Full avatar fitted inside fixed circular frame.")
          print(f"Original image: {source.size}; circular logo exported: {logo.size}")
          PY

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Build debug APK
        run: gradle -p android-rebunar :app:assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: rebunar-android-debug
          path: android-rebunar/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14

      - name: Upload processed logo preview
        uses: actions/upload-artifact@v4
        with:
          name: rebunar-circular-logo-preview
          path: rebunar-logo-preview.png
          if-no-files-found: error
          retention-days: 14

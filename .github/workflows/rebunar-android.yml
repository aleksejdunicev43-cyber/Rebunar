name: Rebunar Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - feature/rebunar-android-shell
    paths:
      - "android-rebunar/**"
      - ".github/workflows/rebunar-android.yml"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Prepare full circular Rebunar logo
        run: |
          python -m pip install Pillow numpy
          python - <<'PY'
          from PIL import Image, ImageDraw, ImageFilter
          import numpy as np

          path = "android-rebunar/app/src/main/res/drawable/rebunar_logo.png"
          source = Image.open(path).convert("RGBA")
          pixels = np.asarray(source.convert("RGB"))
          red, green, blue = pixels[:,:,0], pixels[:,:,1], pixels[:,:,2]

          # Detect the original green outer ring to retain the full logo artwork.
          green_ring = (green > 65) & (green > red * 1.22) & (green > blue * 1.12)
          ys, xs = np.where(green_ring)
          if len(xs) < 100:
              raise RuntimeError("Could not reliably detect the green outer circle; refusing to crop the logo.")

          left, right = int(xs.min()), int(xs.max())
          top, bottom = int(ys.min()), int(ys.max())
          cx = (left + right) / 2
          cy = (top + bottom) / 2
          radius = min(right - left, bottom - top) / 2

          # Keep the complete circle, including R, character, REBUNAR and the rim.
          pad = 2
          x0 = max(0, int(round(cx - radius - pad)))
          y0 = max(0, int(round(cy - radius - pad)))
          x1 = min(source.width, int(round(cx + radius + pad + 1)))
          y1 = min(source.height, int(round(cy + radius + pad + 1)))
          logo = source.crop((x0, y0, x1, y1))
          side = min(logo.size)
          crop_left = (logo.width - side) // 2
          crop_top = (logo.height - side) // 2
          logo = logo.crop((crop_left, crop_top, crop_left + side, crop_top + side))
          logo = logo.resize((512, 512), Image.Resampling.LANCZOS)

          # Apply a clean circular alpha edge.
          mask = Image.new("L", (512, 512), 0)
          ImageDraw.Draw(mask).ellipse((1, 1, 510, 510), fill=255)
          logo.putalpha(mask)

          # Add a geometrically perfect, consistent neon-green finishing rim.
          # A restrained soft glow keeps the original Steel & Blood / neon look.
          glow = Image.new("RGBA", (512, 512), (0, 0, 0, 0))
          ImageDraw.Draw(glow).ellipse((4.5, 4.5, 507.5, 507.5),
                                       outline=(35, 255, 75, 150), width=5)
          glow = glow.filter(ImageFilter.GaussianBlur(3))
          logo = Image.alpha_composite(logo, glow)
          ImageDraw.Draw(logo).ellipse((5.5, 5.5, 506.5, 506.5),
                                       outline=(95, 255, 115, 245), width=2)

          # Re-apply the circular mask so all four outside corners stay transparent.
          logo.putalpha(ImageChops.multiply(logo.getchannel("A"), mask))
          logo.save(path, format="PNG", optimize=True)
          logo.save("rebunar-logo-preview.png", format="PNG", optimize=True)
          print(f"Detected green ring bounds: ({left}, {top}) - ({right}, {bottom})")
          print(f"Original image: {source.size}; circular logo exported: {logo.size}")
          PY

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Build debug APK
        run: gradle -p android-rebunar :app:assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: rebunar-android-debug
          path: android-rebunar/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14

      - name: Upload processed logo preview
        uses: actions/upload-artifact@v4
        with:
          name: rebunar-circular-logo-preview
          path: rebunar-logo-preview.png
          if-no-files-found: error
          retention-days: 14

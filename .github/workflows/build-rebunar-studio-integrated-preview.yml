name: Build Rebunar with embedded Godot Editor preview

on:
  workflow_dispatch:
  push:
    branches:
      - feature/rebunar-studio-godot-editor
    paths:
      - "scripts/prepare_godot_editor_library.py"
      - ".github/workflows/build-rebunar-studio-integrated-preview.yml"
      - "frontend/**"
      - "package.json"
      - "package-lock.json"
  pull_request:
    branches:
      - main
    paths:
      - "scripts/prepare_godot_editor_library.py"
      - ".github/workflows/build-rebunar-studio-integrated-preview.yml"
      - "frontend/**"
      - "package.json"
      - "package-lock.json"

permissions:
  contents: read

jobs:
  build-integrated-preview:
    name: Build one Rebunar APK with embedded Godot Editor
    runs-on: ubuntu-24.04
    timeout-minutes: 150
    steps:
      - name: Checkout Rebunar source
        uses: actions/checkout@v4

      - name: Checkout Rebunar Android shell
        uses: actions/checkout@v4
        with:
          ref: feature/android-bundled-frontend
          path: android-shell

      - name: Checkout pinned Godot source
        uses: actions/checkout@v4
        with:
          repository: godotengine/godot
          ref: 4.7.2-stable
          path: godot-src
          fetch-depth: 1
          submodules: recursive

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Build Rebunar frontend
        run: |
          npm ci
          npm run build
          test -s frontend/build/index.html
          mkdir -p android-shell/android-rebunar/app/src/main/assets/build
          cp -R frontend/build/. android-shell/android-rebunar/app/src/main/assets/build/

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Python and SCons
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install SCons
        run: python -m pip install --upgrade scons

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools'

      - name: Install pinned Android SDK and NDK
        run: |
          yes | sdkmanager --licenses >/dev/null
          sdkmanager "platform-tools" "platforms;android-36" "build-tools;36.1.0" "ndk;29.0.14206865"

      - name: Download Android Swappy dependency
        working-directory: godot-src
        shell: bash
        run: |
          set -euo pipefail
          for attempt in 1 2 3 4 5; do
            echo "Swappy download attempt ${attempt}/5"
            if python misc/scripts/install_swappy_android.py; then
              exit 0
            fi
            if [ "${attempt}" -lt 5 ]; then
              sleep $((attempt * 15))
            fi
          done
          echo "Swappy download failed after five attempts." >&2
          exit 1

      - name: Build Godot editor native libraries
        working-directory: godot-src
        run: |
          scons platform=android target=editor arch=arm64 production=yes dev_mode=yes module_text_server_fb_enabled=yes swappy=yes -j2

      - name: Prepare Godot Editor as an internal Rebunar module
        run: |
          python scripts/prepare_godot_editor_library.py \
            --android-project android-shell/android-rebunar \
            --godot-root godot-src

      - name: Build the single Rebunar APK using Godot's pinned Gradle toolchain
        working-directory: godot-src/platform/android/java
        env:
          REBUNAR_ANDROID_PROJECT: ${{ github.workspace }}/android-shell/android-rebunar
        run: ./gradlew --no-daemon :rebunarApp:assembleDebug --stacktrace

      - name: Verify one APK contains Rebunar frontend and Godot Editor
        working-directory: android-shell/android-rebunar
        run: |
          set -euo pipefail
          APK="app/build/outputs/apk/debug/app-debug.apk"
          test -s "$APK"
          "$ANDROID_HOME/build-tools/36.1.0/aapt" dump badging "$APK" | grep -q "package: name='ru.rebunar.app'"
          unzip -l "$APK" | grep -q 'lib/arm64-v8a/libgodot_android.so'
          unzip -l "$APK" | grep -q 'assets/build/index.html'
          "$ANDROID_HOME/build-tools/36.1.0/aapt" dump xmltree "$APK" AndroidManifest.xml | grep -q 'org.godotengine.editor.GodotEditor'
          echo "Verified one Rebunar APK with bundled frontend and embedded Godot Editor."

      - name: Upload integrated Rebunar preview APK
        uses: actions/upload-artifact@v4
        with:
          name: rebunar-integrated-studio-preview
          path: android-shell/android-rebunar/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14

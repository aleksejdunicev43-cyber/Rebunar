name: Build Rebunar with embedded Godot Editor preview

on:
  workflow_dispatch:
  push:
    branches:
      - feature/rebunar-studio-godot-editor
    paths:
      - "scripts/prepare_godot_editor_library.py"
      - ".github/workflows/build-rebunar-studio-integrated-preview.yml"
      - "frontend/**"
      - "package.json"
      - "package-lock.json"
  pull_request:
    branches:
      - main
    paths:
      - "scripts/prepare_godot_editor_library.py"
      - ".github/workflows/build-rebunar-studio-integrated-preview.yml"
      - "frontend/**"
      - "package.json"
      - "package-lock.json"

permissions:
  contents: read

jobs:
  build-integrated-preview:
    name: Build one Rebunar APK with embedded Godot Editor
    runs-on: ubuntu-24.04
    timeout-minutes: 150
    steps:
      - name: Checkout Rebunar source
        uses: actions/checkout@v4

      - name: Checkout Rebunar Android shell
        uses: actions/checkout@v4
        with:
          ref: feature/android-bundled-frontend
          path: android-shell

      - name: Verify Android launcher resources
        run: |
          test -s android-shell/android-rebunar/app/src/main/res/drawable/rebunar_logo.xml
          test -s android-shell/android-rebunar/app/src/main/res/drawable/rebunar_icon.xml

      - name: Checkout pinned Godot source
        uses: actions/checkout@v4
        with:
          repository: godotengine/godot
          ref: 4.7.2-stable
          path: godot-src
          fetch-depth: 1
          submodules: recursive

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Build Rebunar frontend
        run: |
          npm ci
          npm run build
          test -s frontend/build/index.html
          mkdir -p android-shell/android-rebunar/app/src/main/assets/build
          cp -R frontend/build/. android-shell/android-rebunar/app/src/main/assets/build/

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Python and SCons
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install SCons
        run: python -m pip install --upgrade scons

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools'

      - name: Install pinned Android SDK and NDK
        run: |
          yes | sdkmanager --licenses >/dev/null
          sdkmanager "platform-tools" "platforms;android-36" "build-tools;36.1.0" "ndk;29.0.14206865"

      - name: Build Godot editor native libraries
        working-directory: godot-src
        run: |
          scons platform=android target=editor arch=arm64 production=yes dev_mode=yes module_text_server_fb_enabled=yes swappy=no -j2

      - name: Prepare Godot Editor as an internal Rebunar module
        run: |
          python scripts/prepare_godot_editor_library.py \
            --android-project android-shell/android-rebunar \
            --godot-root godot-src

      - name: Ensure Godot Editor activity is registered in the Rebunar app
        run: |
          python - <<'PY'
          from pathlib import Path

          manifest = Path("android-shell/android-rebunar/app/src/main/AndroidManifest.xml")
          source = manifest.read_text(encoding="utf-8")
          activity_name = 'android:name="org.godotengine.editor.GodotEditor"'
          if activity_name not in source:
              declaration = """
                  <activity
                      android:name="org.godotengine.editor.GodotEditor"
                      android:configChanges="layoutDirection|locale|orientation|keyboardHidden|screenSize|smallestScreenSize|density|keyboard|navigation|screenLayout|uiMode"
                      android:exported="false"
                      android:launchMode="singleInstancePerTask"
                      android:screenOrientation="userLandscape"
                      android:theme="@style/GodotEditorSplashScreenTheme" />
              """
              if source.count("</application>") != 1:
                  raise SystemExit("Could not identify exactly one application manifest section")
              source = source.replace("</application>", declaration + "\n    </application>", 1)
              manifest.write_text(source, encoding="utf-8")
          print("Godot Editor activity is explicitly registered in the Rebunar manifest.")
          PY

      - name: Download pinned Gradle distribution with retries
        run: |
          set -euo pipefail
          GRADLE_VERSION="8.11.1"
          GRADLE_HOME="$RUNNER_TEMP/gradle-$GRADLE_VERSION"
          if [ ! -x "$GRADLE_HOME/bin/gradle" ]; then
            curl --fail --location \
              --retry 10 --retry-all-errors --retry-delay 12 \
              --connect-timeout 30 --max-time 900 \
              "https://services.gradle.org/distributions/gradle-$GRADLE_VERSION-bin.zip" \
              --output "$RUNNER_TEMP/gradle-$GRADLE_VERSION-bin.zip"
            unzip -q "$RUNNER_TEMP/gradle-$GRADLE_VERSION-bin.zip" -d "$RUNNER_TEMP"
          fi
          test -x "$GRADLE_HOME/bin/gradle"
          echo "GRADLE_HOME=$GRADLE_HOME" >> "$GITHUB_ENV"
          echo "$GRADLE_HOME/bin" >> "$GITHUB_PATH"

      - name: Build the single Rebunar APK using the pinned Gradle toolchain
        working-directory: godot-src/platform/android/java
        env:
          REBUNAR_ANDROID_PROJECT: ${{ github.workspace }}/android-shell/android-rebunar
        run: gradle --no-daemon :rebunarApp:assembleDebug --stacktrace

      - name: Verify one APK contains Rebunar frontend and Godot Editor
        working-directory: godot-src/platform/android/java
        run: |
          set -euo pipefail
          echo "---- Locate the APK produced by :rebunarApp:assembleDebug ----"
          find . -type f -path '*/build/outputs/apk/debug/*.apk' -print
          APK="$(find . -type f -path '*/build/outputs/apk/debug/*.apk' -print -quit)"
          if [ -z "$APK" ] || [ ! -s "$APK" ]; then
            echo "::error::Gradle completed, but no debug APK was found."
            exit 1
          fi

          cp "$APK" "$GITHUB_WORKSPACE/rebunar-integrated-studio-preview.apk"
          test -s "$GITHUB_WORKSPACE/rebunar-integrated-studio-preview.apk"
          ls -lh "$GITHUB_WORKSPACE/rebunar-integrated-studio-preview.apk"

          "$ANDROID_HOME/build-tools/36.1.0/aapt" dump badging "$APK" | grep -q "package: name='ru.rebunar.app'"
          unzip -l "$APK" | grep -q 'lib/arm64-v8a/libgodot_android.so'
          unzip -l "$APK" | grep -q 'assets/build/index.html'

          AAPT="$ANDROID_HOME/build-tools/36.1.0/aapt"
          echo "---- Merged APK manifest (activities) ----"
          "$AAPT" dump xmltree "$APK" AndroidManifest.xml | tee "$RUNNER_TEMP/rebunar-manifest.txt"
          if ! grep -Fq 'org.godotengine.editor.GodotEditor' "$RUNNER_TEMP/rebunar-manifest.txt"; then
            echo "::error::APK does not contain the registered GodotEditor activity."
            exit 1
          fi
          echo "Verified one Rebunar APK with bundled frontend and embedded Godot Editor."

      - name: Upload integrated Rebunar preview APK
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rebunar-integrated-studio-preview
          path: ${{ github.workspace }}/rebunar-integrated-studio-preview.apk
          if-no-files-found: error
          retention-days: 14

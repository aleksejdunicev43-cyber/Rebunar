name: Rebunar CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# Prevent overlapping deployments from deleting one another's hashed assets.
concurrency:
  group: rebunar-production-deploy
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  build:
    name: Build frontend
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check Python backend syntax
        run: python3 -m py_compile server.py metrics_routes.py community_routes.py static_routes.py matrix_routes.py frontend_routes.py reader_media_routes.py home_settings_routes.py reader_helpers.py reader_public_routes.py reader_progress_routes.py reader_studio_list_routes.py reader_library_routes.py reader_studio_edit_routes.py

      - name: Test Reader routes
        run: |
          python3 -m pip install Flask Pillow
          python3 -m unittest discover -s tests/reader -v

      - name: Test Community routes
        run: python3 -m unittest discover -s tests/communities -v

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build Rebunar
        run: npm run build

      - name: Save production build
        uses: actions/upload-artifact@v4
        with:
          name: rebunar-frontend-build
          path: frontend/build/
          if-no-files-found: error
          retention-days: 7

      - name: Deploy to PythonAnywhere
        if: success() && github.event_name != 'pull_request' && (github.event_name == 'workflow_dispatch' || github.ref == 'refs/heads/main')
        env:
          PA_USERNAME: rebunar
          PA_API_TOKEN: ${{ secrets.PA_API_TOKEN }}
          PA_HOST: www.pythonanywhere.com
        run: |
          python -m pip install requests
          python - <<'PY'
          import os
          import re
          import time
          from pathlib import Path
          from urllib.parse import quote
          import requests

          username = os.environ["PA_USERNAME"].strip()
          token = os.environ["PA_API_TOKEN"].strip()
          host = os.environ["PA_HOST"].strip().removeprefix("https://").rstrip("/")

          if not token:
              raise SystemExit(
                  "PA_API_TOKEN is empty. Add the PythonAnywhere API token as "
                  "the GitHub repository secret PA_API_TOKEN."
              )
          if host not in {"www.pythonanywhere.com", "eu.pythonanywhere.com"}:
              raise SystemExit("Invalid PythonAnywhere API host configuration")

          build = Path("frontend/build")
          files = sorted(p for p in build.rglob("*") if p.is_file())
          if not files:
              raise SystemExit("frontend/build is empty; deployment cancelled")

          headers = {"Authorization": f"Token {token}"}
          base = f"https://{host}/api/v0/user/{quote(username, safe='')}/files/path"

          def api_request_with_retry(method, url, *, operation, **kwargs):
              max_attempts = 6
              for attempt in range(1, max_attempts + 1):
                  try:
                      response = requests.request(method, url, **kwargs)
                  except requests.RequestException as exc:
                      if attempt == max_attempts:
                          raise SystemExit(f"{operation} failed after {max_attempts} attempts: {exc}")
                      delay = min(10 * attempt, 60)
                      print(f"{operation}: network error; retry {attempt + 1}/{max_attempts} in {delay}s")
                      time.sleep(delay)
                      continue

                  if response.status_code not in (429, 500, 502, 503, 504):
                      return response
                  if attempt == max_attempts:
                      raise SystemExit(
                          f"{operation} failed after {max_attempts} attempts: "
                          f"HTTP {response.status_code} {response.text[:500]}"
                      )
                  retry_after = response.headers.get("Retry-After")
                  try:
                      delay = max(10, int(retry_after)) if retry_after else min(10 * attempt, 60)
                  except ValueError:
                      delay = min(10 * attempt, 60)
                  print(
                      f"{operation}: HTTP {response.status_code}; "
                      f"retry {attempt + 1}/{max_attempts} in {delay}s"
                  )
                  time.sleep(delay)
              raise SystemExit(f"{operation} did not complete.")

          # Remove the retired circular avatar PNG directory from the live build.
          legacy_frames_remote = f"/home/{username}/rebunar_next/frontend/build/assets/frames/"
          cleanup_url = base + quote(legacy_frames_remote, safe="/")
          cleanup_response = api_request_with_retry(
              "DELETE", cleanup_url, operation="Legacy avatar frame cleanup",
              headers=headers, timeout=60,
          )
          if cleanup_response.status_code not in (204, 404):
              raise SystemExit(
                  f"Legacy avatar frame cleanup failed: HTTP {cleanup_response.status_code} "
                  f"{cleanup_response.text[:500]}"
              )
          print("Removed legacy circular avatar frame assets (or confirmed they were already absent).")

          # Free quota by removing only obsolete, hash-named build assets that
          # are not part of this exact build. Keep directories and user data.
          current_assets = {
              file.relative_to(build).as_posix()
              for file in files
              if file.relative_to(build).parts[0] == "assets"
          }
          assets_remote = f"/home/{username}/rebunar_next/frontend/build/assets/"
          assets_url = base + quote(assets_remote, safe="/")
          assets_response = api_request_with_retry(
              "GET", assets_url, operation="Inspect existing build assets",
              headers=headers, timeout=60,
          )
          if assets_response.status_code != 200:
              raise SystemExit(
                  f"Could not inspect existing build assets: HTTP {assets_response.status_code} "
                  f"{assets_response.text[:500]}"
              )
          existing_assets = assets_response.json()
          hashed_asset = re.compile(r".+-[A-Za-z0-9_-]{8,}\.(?:js|css|wasm|woff2?|ttf|otf|svg|png|webp|jpe?g)$")
          removed_assets = 0
          for name, metadata in existing_assets.items():
              if (
                  metadata.get("type") == "file"
                  and hashed_asset.fullmatch(name)
                  and f"assets/{name}" not in current_assets
              ):
                  stale_path = assets_remote + name
                  stale_url = base + quote(stale_path, safe="/")
                  stale_response = api_request_with_retry(
                      "DELETE", stale_url, operation=f"Remove obsolete build asset {name}",
                      headers=headers, timeout=60,
                  )
                  if stale_response.status_code not in (204, 404):
                      raise SystemExit(
                          f"Could not remove obsolete build asset {name}: "
                          f"HTTP {stale_response.status_code} {stale_response.text[:300]}"
                      )
                  removed_assets += 1
                  time.sleep(1.6)
          print(f"Removed {removed_assets} obsolete hashed build assets; current build assets were preserved.")

          def upload_with_retry(file, relative, url, index, total):
              max_attempts = 6
              for attempt in range(1, max_attempts + 1):
                  try:
                      with file.open("rb") as stream:
                          response = requests.post(
                              url,
                              headers=headers,
                              files={"content": (file.name, stream, "application/octet-stream")},
                              timeout=60,
                          )
                  except requests.RequestException as exc:
                      if attempt == max_attempts:
                          raise SystemExit(
                              f"Upload failed for {relative}: network error after {max_attempts} attempts: {exc}"
                          )
                      delay = min(5 * attempt, 30)
                      print(f"Upload network error for {relative}; retry {attempt + 1}/{max_attempts} in {delay}s")
                      time.sleep(delay)
                      continue

                  if response.status_code in (200, 201):
                      print(f"[{index}/{total}] uploaded {relative}")
                      return

                  if response.status_code == 429:
                      retry_after = response.headers.get("Retry-After")
                      try:
                          delay = max(10, int(retry_after)) if retry_after else min(10 * attempt, 60)
                      except ValueError:
                          delay = min(10 * attempt, 60)
                      if attempt == max_attempts:
                          raise SystemExit(
                              f"Upload failed for {relative}: HTTP 429 after {max_attempts} attempts."
                          )
                      print(f"PythonAnywhere rate limit for {relative}; retry {attempt + 1}/{max_attempts} in {delay}s")
                      time.sleep(delay)
                      continue

                  raise SystemExit(
                      f"Upload failed for {relative}: HTTP {response.status_code} "
                      f"{response.text[:500]}"
                  )

          for index, file in enumerate(files, 1):
              relative = file.relative_to(build).as_posix()
              remote = f"/home/{username}/rebunar_next/frontend/build/{relative}"
              url = base + quote(remote, safe="/")
              upload_with_retry(file, relative, url, index, len(files) + 1)
              time.sleep(2.5)

          backend_files = [Path("metrics_routes.py"), Path("community_routes.py"), Path("static_routes.py"), Path("matrix_routes.py"), Path("frontend_routes.py"), Path("home_settings_routes.py"), Path("reader_media_routes.py"), Path("reader_helpers.py"), Path("reader_public_routes.py"), Path("reader_progress_routes.py"), Path("reader_studio_list_routes.py"), Path("reader_library_routes.py"), Path("reader_studio_edit_routes.py"), Path("reader_studio_pages_routes.py"), Path("server.py")]
          total_uploads = len(files) + len(backend_files)
          for index, backend_file in enumerate(backend_files, len(files) + 1):
              relative = backend_file.as_posix()
              backend_remote = f"/home/{username}/rebunar_next/{relative}"
              backend_url = base + quote(backend_remote, safe="/")
              upload_with_retry(backend_file, relative, backend_url, index, total_uploads)

          reload_url = (
              f"https://{host}/api/v0/user/{quote(username, safe='')}"
              "/webapps/rebunar.pythonanywhere.com/reload/"
          )
          reload_completed = False
          for attempt in range(1, 7):
              try:
                  response = requests.post(
                      reload_url,
                      headers=headers,
                      timeout=(15, 120),
                  )
              except requests.RequestException as exc:
                  if attempt == 6:
                      raise SystemExit(
                          f"Webapp reload failed: network error after 6 attempts: {exc}"
                      )
                  delay = min(10 * attempt, 60)
                  print(f"PythonAnywhere reload network error; retry {attempt + 1}/6 in 60s: {exc}")
                  time.sleep(delay)
                  continue

              if response.status_code in (200, 201, 202, 204):
                  print("PythonAnywhere deployment and webapp reload completed.")
                  reload_completed = True
                  break

              if response.status_code == 429 and attempt < 6:
                  retry_after = response.headers.get("Retry-After")
                  try:
                      delay = max(10, int(retry_after)) if retry_after else min(10 * attempt, 60)
                  except ValueError:
                      delay = min(10 * attempt, 60)
                  print(f"PythonAnywhere reload rate limit; retry {attempt + 1}/6 in {delay}s")
                  time.sleep(delay)
                  continue

              raise SystemExit(
                  f"Webapp reload failed: HTTP {response.status_code} {response.text[:500]}"
              )

          if not reload_completed:
              raise SystemExit("Webapp reload did not complete after 6 attempts.")
          PY

      - name: Install Playwright browser
        if: success() && github.event_name != 'pull_request'
        run: |
          npm install --no-save playwright
          npx playwright install --with-deps chromium

      - name: Capture production screenshots and check avatar frames
        if: success() && github.event_name != 'pull_request'
        env:
          REBUNAR_BASE_URL: https://rebunar.pythonanywhere.com/new
          REBUNAR_TEST_USERNAME: ${{ secrets.REBUNAR_TEST_USERNAME }}
          REBUNAR_TEST_PASSWORD: ${{ secrets.REBUNAR_TEST_PASSWORD }}
        run: node tests/visual/screenshot.mjs

      - name: Save visual test screenshots and report
        if: always() && github.event_name != 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: rebunar-visual-check
          path: artifacts/visual/
          if-no-files-found: warn
          retention-days: 14

  emulator-smoke:
    name: Launch Rebunar in Android emulator
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout Rebunar
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Build frontend for Android
        run: |
          npm ci
          npm run build
          test -s frontend/build/index.html

      - name: Checkout Android application source
        uses: actions/checkout@v4
        with:
          ref: feature/android-bundled-frontend
          path: android-source

      - name: Prepare Android project
        run: |
          cp -R android-source/android-rebunar ./android-rebunar
          mkdir -p android-rebunar/app/src/main/res/drawable-nodpi
          cp android-source/rebunar_avatar.png android-rebunar/app/src/main/res/drawable-nodpi/rebunar_logo.png
          test -s android-rebunar/app/src/main/res/drawable-nodpi/rebunar_logo.png
          mkdir -p android-rebunar/app/src/main/assets/build
          cp -R frontend/build/. android-rebunar/app/src/main/assets/build/
          test -s android-rebunar/app/src/main/assets/build/index.html
          grep -q 'serveBundledFrontend' android-rebunar/app/src/main/java/ru/rebunar/app/MainActivity.kt

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Use Android debug signing for emulator test
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path("android-rebunar/app/build.gradle.kts")
          content = path.read_text()
          target = 'signingConfig = signingConfigs.getByName("rebunarStable")'
          if content.count(target) != 1:
              raise SystemExit(f"Expected 1 release signing assignment, found {content.count(target)}")
          path.write_text(content.replace(target, "signingConfig = signingConfigs.getByName(\"debug\")", 1))
          PY

      - name: Build debug APK
        run: gradle -p android-rebunar :app:assembleDebug

      - name: Enable KVM or prepare software fallback
        run: |
          if [ -e /dev/kvm ]; then
            echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
            sudo udevadm control --reload-rules
            sudo udevadm trigger --name-match=kvm
          fi
          if [ -r /dev/kvm ] && [ -w /dev/kvm ]; then
            echo "KVM hardware acceleration is available."
          else
            echo "KVM is unavailable; enabling Android emulator TCG fallback."
            echo "ANDROID_I_WANT_MY_TCG=yes" >> "$GITHUB_ENV"
          fi

      - name: Launch on Android emulator and capture screen
        uses: reactivecircus/android-emulator-runner@v2
        env:
          REBUNAR_TEST_USERNAME: ${{ secrets.REBUNAR_TEST_USERNAME }}
          REBUNAR_TEST_PASSWORD: ${{ secrets.REBUNAR_TEST_PASSWORD }}
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_6
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -no-snapshot -no-snapshot-save -wipe-data
          disable-animations: true
          script: |
            mkdir -p emulator-output
            # The emulator action already waits for boot; allow ADB to settle and verify it.
            adb wait-for-device
            sleep 10
            adb devices -l
            adb shell getprop sys.boot_completed
            test -s android-rebunar/app/build/outputs/apk/debug/app-debug.apk
            adb install -r android-rebunar/app/build/outputs/apk/debug/app-debug.apk
            adb logcat -c
            adb shell am force-stop ru.rebunar.app
            adb shell am start -W -n ru.rebunar.app/.MainActivity
            sleep 25
            adb exec-out screencap -p > emulator-output/rebunar-before-login.png
            adb shell uiautomator dump /sdcard/window-before.xml >/dev/null 2>&1 || true
            adb pull /sdcard/window-before.xml emulator-output/window-before.xml >/dev/null 2>&1 || true
            if test -n "$REBUNAR_TEST_USERNAME" && test -n "$REBUNAR_TEST_PASSWORD"; then echo "Test credentials are configured; attempting the login flow."; adb shell input tap 540 950; adb shell input text "$REBUNAR_TEST_USERNAME"; adb shell input keyevent 61; adb shell input text "$REBUNAR_TEST_PASSWORD"; adb shell input keyevent 61; adb shell input keyevent 66; sleep 15; else echo "Test credentials are not configured; leaving the app on its initial screen."; fi
            adb exec-out screencap -p > emulator-output/rebunar-screen.png
            adb shell uiautomator dump /sdcard/window.xml >/dev/null 2>&1 || true
            adb pull /sdcard/window.xml emulator-output/window.xml >/dev/null 2>&1 || true
            adb logcat -d -t 10000 > emulator-output/logcat.txt
            adb logcat -d -s RebunarWeb:I RebunarWeb:D RebunarWeb:E RebunarWebConsole:E chromium:E > emulator-output/webview-diagnostics.txt
            adb shell pidof ru.rebunar.app > emulator-output/app-pid.txt
            test -s emulator-output/rebunar-before-login.png
            test -s emulator-output/rebunar-screen.png
            test -s emulator-output/app-pid.txt
            grep -q "Главный экран Rebunar" emulator-output/window.xml || { echo "Rebunar home screen was not found in the Android UI hierarchy. See screenshots and logcat."; exit 1; }
            # Exercise the native bottom navigation; UI hierarchy places its buttons at y=2315.
            for destination in "store:275" "reader:450" "community:630" "chats:806" "more:984" "home-return:96"; do name="${destination%%:*}"; x="${destination##*:}"; adb shell input tap "$x" 2315; sleep 5; adb exec-out screencap -p > "emulator-output/rebunar-$name.png"; adb shell uiautomator dump "/sdcard/window-$name.xml" >/dev/null 2>&1 || true; adb pull "/sdcard/window-$name.xml" "emulator-output/window-$name.xml" >/dev/null 2>&1 || true; test -s "emulator-output/rebunar-$name.png" || exit 1; done
            test -s emulator-output/rebunar-store.png
            test -s emulator-output/rebunar-reader.png
            test -s emulator-output/rebunar-community.png
            test -s emulator-output/rebunar-chats.png
            test -s emulator-output/rebunar-more.png
            test -s emulator-output/rebunar-home-return.png
            grep -q 'Магазин' emulator-output/window-store.xml
            grep -q 'Читалка' emulator-output/window-reader.xml
            grep -q 'Сообщества' emulator-output/window-community.xml
            grep -q 'Чаты' emulator-output/window-chats.xml

      - name: Upload emulator evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rebunar-android-emulator-evidence
          path: emulator-output/
          if-no-files-found: warn
          retention-days: 7

name: Rebunar CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build frontend
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build Rebunar
        run: npm run build

      - name: Save production build
        uses: actions/upload-artifact@v4
        with:
          name: rebunar-frontend-build
          path: frontend/build/
          if-no-files-found: error
          retention-days: 7

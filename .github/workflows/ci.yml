name: Rebunar CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build frontend
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build Rebunar
        run: npm run build

      - name: Save production build
        uses: actions/upload-artifact@v4
        with:
          name: rebunar-frontend-build
          path: frontend/build/
          if-no-files-found: error
          retention-days: 7

      - name: Deploy to PythonAnywhere
        if: success() && github.event_name != 'pull_request' && (github.event_name == 'workflow_dispatch' || github.ref == 'refs/heads/main')
        env:
          PA_USERNAME: rebunar
          PA_API_TOKEN: ${{ secrets.PA_API_TOKEN }}
          PA_HOST: www.pythonanywhere.com
        run: |
          python -m pip install requests
          python - <<'PY'
          import os
          import time
          from pathlib import Path
          from urllib.parse import quote
          import requests

          username = os.environ["PA_USERNAME"].strip()
          token = os.environ["PA_API_TOKEN"].strip()
          host = os.environ["PA_HOST"].strip().removeprefix("https://").rstrip("/")

          if not token:
              raise SystemExit(
                  "PA_API_TOKEN is empty. Add the PythonAnywhere API token as "
                  "the GitHub repository secret PA_API_TOKEN."
              )
          if host not in {"www.pythonanywhere.com", "eu.pythonanywhere.com"}:
              raise SystemExit("Invalid PythonAnywhere API host configuration")

          build = Path("frontend/build")
          files = sorted(p for p in build.rglob("*") if p.is_file())
          if not files:
              raise SystemExit("frontend/build is empty; deployment cancelled")

          headers = {"Authorization": f"Token {token}"}
          base = f"https://{host}/api/v0/user/{quote(username, safe='')}/files/path"

          def upload_with_retry(file, relative, url, index, total):
              max_attempts = 6
              for attempt in range(1, max_attempts + 1):
                  try:
                      with file.open("rb") as stream:
                          response = requests.post(
                              url,
                              headers=headers,
                              files={"content": (file.name, stream, "application/octet-stream")},
                              timeout=60,
                          )
                  except requests.RequestException as exc:
                      if attempt == max_attempts:
                          raise SystemExit(
                              f"Upload failed for {relative}: network error after {max_attempts} attempts: {exc}"
                          )
                      delay = min(5 * attempt, 30)
                      print(f"Upload network error for {relative}; retry {attempt + 1}/{max_attempts} in {delay}s")
                      time.sleep(delay)
                      continue

                  if response.status_code in (200, 201):
                      print(f"[{index}/{total}] uploaded {relative}")
                      return

                  if response.status_code == 429:
                      retry_after = response.headers.get("Retry-After")
                      try:
                          delay = max(10, int(retry_after)) if retry_after else min(10 * attempt, 60)
                      except ValueError:
                          delay = min(10 * attempt, 60)
                      if attempt == max_attempts:
                          raise SystemExit(
                              f"Upload failed for {relative}: HTTP 429 after {max_attempts} attempts."
                          )
                      print(f"PythonAnywhere rate limit for {relative}; retry {attempt + 1}/{max_attempts} in {delay}s")
                      time.sleep(delay)
                      continue

                  raise SystemExit(
                      f"Upload failed for {relative}: HTTP {response.status_code} "
                      f"{response.text[:500]}"
                  )

          for index, file in enumerate(files, 1):
              relative = file.relative_to(build).as_posix()
              remote = f"/home/{username}/rebunar_next/frontend/build/{relative}"
              url = base + quote(remote, safe="/")
              upload_with_retry(file, relative, url, index, len(files) + 1)
              time.sleep(2.5)

          backend_file = Path("server.py")
          backend_remote = f"/home/{username}/rebunar_next/server.py"
          backend_url = base + quote(backend_remote, safe="/")
          upload_with_retry(backend_file, "server.py", backend_url, len(files) + 1, len(files) + 1)

          reload_url = (
              f"https://{host}/api/v0/user/{quote(username, safe='')}"
              "/webapps/rebunar.pythonanywhere.com/reload/"
          )
          reload_completed = False
          for attempt in range(1, 7):
              try:
                  response = requests.post(
                      reload_url,
                      headers=headers,
                      timeout=(15, 120),
                  )
              except requests.RequestException as exc:
                  if attempt == 6:
                      raise SystemExit(
                          f"Webapp reload failed: network error after 6 attempts: {exc}"
                      )
                  delay = min(10 * attempt, 60)
                  print(f"PythonAnywhere reload network error; retry {attempt + 1}/6 in 60s: {exc}")
                  time.sleep(delay)
                  continue

              if response.status_code in (200, 201, 202, 204):
                  print("PythonAnywhere deployment and webapp reload completed.")
                  reload_completed = True
                  break

              if response.status_code == 429 and attempt < 6:
                  retry_after = response.headers.get("Retry-After")
                  try:
                      delay = max(10, int(retry_after)) if retry_after else min(10 * attempt, 60)
                  except ValueError:
                      delay = min(10 * attempt, 60)
                  print(f"PythonAnywhere reload rate limit; retry {attempt + 1}/6 in {delay}s")
                  time.sleep(delay)
                  continue

              raise SystemExit(
                  f"Webapp reload failed: HTTP {response.status_code} {response.text[:500]}"
              )

          if not reload_completed:
              raise SystemExit("Webapp reload did not complete after 6 attempts.")
          PY

      - name: Install Playwright browser
        if: success() && github.event_name != 'pull_request'
        run: |
          npm install --no-save playwright
          npx playwright install --with-deps chromium

      - name: Capture production screenshots and check avatar frames
        if: success() && github.event_name != 'pull_request'
        env:
          REBUNAR_BASE_URL: https://rebunar.pythonanywhere.com/new
          REBUNAR_TEST_USERNAME: ${{ secrets.REBUNAR_TEST_USERNAME }}
          REBUNAR_TEST_PASSWORD: ${{ secrets.REBUNAR_TEST_PASSWORD }}
        run: node tests/visual/screenshot.mjs

      - name: Save visual test screenshots and report
        if: always() && github.event_name != 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: rebunar-visual-check
          path: artifacts/visual/
          if-no-files-found: warn
          retention-days: 14

name: Rebunar Android emulator smoke test

on:
  pull_request:
    branches: [main]
  push:
    branches: [feature/rebunar-test-harness]
    paths:
      - "frontend/**"
      - "android-rebunar/**"
      - ".github/workflows/rebunar-android-emulator.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  android-emulator-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout current frontend
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Build Rebunar frontend
        run: |
          npm ci
          npm run build
          test -s frontend/build/index.html

      - name: Checkout Android application source
        uses: actions/checkout@v4
        with:
          ref: feature/android-bundled-frontend
          path: android-source

      - name: Prepare Android project with current frontend
        run: |
          cp -R android-source/android-rebunar ./android-rebunar
          # The legacy launcher XML references a removed rebunar_logo resource.
          # Reuse the existing vector launcher artwork as the missing drawable.
          cp android-rebunar/app/src/main/res/mipmap/ic_launcher.xml android-rebunar/app/src/main/res/drawable/rebunar_logo.xml
          mkdir -p android-rebunar/app/src/main/assets/build
          cp -R frontend/build/. android-rebunar/app/src/main/assets/build/
          test -s android-rebunar/app/src/main/assets/build/index.html

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Create temporary test signing key
        run: |
          keytool -genkeypair -v \
            -keystore "$RUNNER_TEMP/rebunar-test.jks" \
            -storepass test-only-password \
            -alias rebunar-test \
            -keypass test-only-password \
            -keyalg RSA -keysize 2048 -validity 2 \
            -dname "CN=Rebunar CI Test, OU=Testing, O=Rebunar, L=CI, ST=CI, C=US"
          echo "REBUNAR_KEYSTORE_PATH=$RUNNER_TEMP/rebunar-test.jks" >> "$GITHUB_ENV"
          echo "REBUNAR_KEYSTORE_PASSWORD=test-only-password" >> "$GITHUB_ENV"
          echo "REBUNAR_KEY_ALIAS=rebunar-test" >> "$GITHUB_ENV"
          echo "REBUNAR_KEY_PASSWORD=test-only-password" >> "$GITHUB_ENV"

      - name: Build test APK
        run: |
          gradle -p android-rebunar :app:assembleDebug
          test -s android-rebunar/app/build/outputs/apk/debug/app-debug.apk

      - name: Run APK on Android emulator
        uses: reactivecircus/android-emulator-runner@v2
        env:
          # GitHub-hosted runners may not expose KVM; explicitly allow QEMU TCG.
          ANDROID_I_WANT_MY_TCG: "yes"
        with:
          api-level: 35
          arch: x86_64
          profile: pixel_2
          disable-animations: true
          script: |
            set +e
            mkdir -p test-results/android
            echo "Installing Rebunar APK"
            adb install -r android-rebunar/app/build/outputs/apk/debug/app-debug.apk
            install_status=$?
            echo "$install_status" > test-results/android/install-exit-code.txt
            if [ "$install_status" -ne 0 ]; then
              adb logcat -d -t 5000 > test-results/android/logcat.txt 2>&1
              exit "$install_status"
            fi

            adb logcat -c
            adb shell am force-stop ru.rebunar.app
            adb shell monkey -p ru.rebunar.app 1
            launch_status=$?
            echo "$launch_status" > test-results/android/launch-exit-code.txt

            # Give the app time to initialize on slow software-emulated runners.
            sleep 35

            # Stream the screenshot directly to the runner. This avoids writing
            # to /sdcard first, which failed with Permission denied on CI.
            timeout 30s adb exec-out screencap -p > test-results/android/rebunar-screen.png 2> test-results/android/screencap-error.txt
            echo "$?" > test-results/android/screencap-exit-code.txt

            # UI hierarchy is useful evidence but must not hide the logcat report.
            timeout 30s adb shell uiautomator dump /sdcard/rebunar-window.xml > test-results/android/uiautomator-output.txt 2>&1
            if [ "$?" -eq 0 ]; then
              timeout 20s adb pull /sdcard/rebunar-window.xml test-results/android/window.xml
            fi

            adb logcat -d -t 8000 > test-results/android/logcat.txt 2>&1
            adb shell pidof ru.rebunar.app > test-results/android/app-pid.txt 2>&1
            pid_status=$?
            echo "$pid_status" > test-results/android/app-pid-exit-code.txt

            echo "Emulator diagnostics:"
            ls -lah test-results/android
            if [ "$pid_status" -ne 0 ] || [ ! -s test-results/android/app-pid.txt ]; then
              echo "Rebunar process is not running after launch."
              exit 1
            fi
            if [ "$launch_status" -ne 0 ]; then
              echo "Android launch command returned a non-zero exit code."
              exit "$launch_status"
            fi

      - name: Upload Android emulator evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rebunar-android-emulator-results
          path: test-results/android/
          if-no-files-found: warn
          retention-days: 7
